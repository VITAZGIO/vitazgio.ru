      <style>
        :root { color-scheme:dark; --line:rgba(255,255,255,.1); --muted:#8b93a7;
                --ac:#4d6bfe; --ac2:#8b7bff; --ok:#63f5ad; --warm:#ffd84a;
                --panel:rgba(12,17,32,.72); }
        /* Каждая нейронка со своим цветом — как вкладки сверху */
        html[data-net="minimax"] { --ac:#ff3d9a; --ac2:#ff8fc4; }
        html[data-net="nvidia"]  { --ac:#76c900; --ac2:#39ff14; }
        * { box-sizing:border-box; }
        html, body { height:100%; margin:0; }
        body { color:#eef2fb; font-family:"Cascadia Code", Consolas, monospace;
               background:radial-gradient(1100px 700px at 12% -8%, color-mix(in srgb, var(--ac) 22%, #0b1020), #0b1020 55%);
               display:flex; flex-direction:column; overflow:hidden; }
        a { color:inherit; }

        .bar { display:flex; align-items:center; gap:12px; padding:11px clamp(12px,2vw,20px);
               border-bottom:1px solid var(--line); background:rgba(8,12,24,.5); flex:none; }
        .back, .burger { width:40px; height:40px; flex:none; display:grid; place-items:center;
                 color:var(--ac); text-decoration:none; cursor:pointer;
                 border:1px solid color-mix(in srgb, var(--ac) 32%, transparent); border-radius:11px;
                 background:color-mix(in srgb, var(--ac) 8%, transparent); transition:.16s; }
        .back:hover, .burger:hover { color:#fff; border-color:var(--ac); background:color-mix(in srgb, var(--ac) 20%, transparent); }
        .back svg, .burger svg { width:19px; height:19px; }
        .burger { display:none; }
        html.embed .back { display:none; }   /* встроена во вкладку «Нейронки» */
        .brand { flex:1; min-width:0; }
        .brand b { display:block; font-size:1.06rem; letter-spacing:-.01em; }
        .brand span { display:block; margin-top:2px; color:var(--muted); font-size:.68rem;
                      white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .dot { display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:5px;
               background:var(--muted); vertical-align:middle; }
        .dot.on { background:var(--ok); box-shadow:0 0 9px var(--ok); }
        .dot.off { background:var(--warm); }

        .wrap { flex:1; min-height:0; display:flex; position:relative; }
        .aside { width:317px; flex:none; border-right:1px solid var(--line); background:var(--panel);
                 display:flex; flex-direction:column; min-height:0;
                 transition:width .18s ease, opacity .18s ease; }
        .wrap.collapsed .aside { width:0; opacity:0; overflow:hidden; border-right:0; pointer-events:none; }
        .sidebtn { width:44px; height:44px; flex:none; display:grid; place-items:center;
                   color:var(--muted); cursor:pointer; border:1px solid var(--line); border-radius:12px;
                   background:rgba(255,255,255,.03); transition:.16s; }
        .sidebtn:hover { color:#fff; border-color:rgba(255,255,255,.25); background:rgba(255,255,255,.08); }
        .sidebtn svg { width:18px; height:18px; }
        /* Кнопка «развернуть обратно» — вне .aside (её саму скрывает
           collapsed), плавает у левого края поверх чата, видна только
           когда список свёрнут. */
        .sideopen { display:none; position:absolute; z-index:6; top:12px; left:12px;
                    box-shadow:0 6px 20px rgba(0,0,0,.35); }
        .wrap.collapsed .sideopen { display:grid; }
        @media (max-width:760px) { .sidebtn, .wrap.collapsed .sideopen { display:none; } }
        .newrow { display:flex; gap:7px; margin:12px; }
        .search-row { margin:0 12px 10px; position:relative; }
        .search-row input { width:100%; height:36px; padding:0 32px 0 11px; color:#f4f7ff;
                            font:400 .78rem inherit; border:1px solid var(--line); border-radius:10px;
                            outline:none; background:rgba(4,9,20,.55); }
        .search-row input:focus { border-color:var(--ac); }
        .search-row input::placeholder { color:#5c6780; }
        .search-row .sic { position:absolute; right:9px; top:50%; transform:translateY(-50%);
                           color:var(--muted); pointer-events:none; }
        .search-row .sic svg { width:15px; height:15px; display:block; }
        .search-row .sclear { position:absolute; right:6px; top:50%; transform:translateY(-50%);
                              width:22px; height:22px; display:none; place-items:center; cursor:pointer;
                              color:var(--muted); border-radius:6px; }
        .search-row.filled .sic { display:none; }
        .search-row.filled .sclear { display:grid; }
        .search-row .sclear:hover { color:#fff; background:rgba(255,255,255,.1); }
        .pin-sect { padding:2px 10px 4px; color:var(--muted); font-size:.63rem;
                    letter-spacing:.08em; text-transform:uppercase; }
        .newbtn { flex:1; height:44px; display:flex; align-items:center;
                  justify-content:center; gap:9px; cursor:pointer; color:#eaf0ff;
                  font:700 .82rem inherit; border:1px solid color-mix(in srgb, var(--ac) 40%, transparent);
                  border-radius:12px; background:linear-gradient(160deg, color-mix(in srgb, var(--ac) 22%, transparent), color-mix(in srgb, var(--ac2) 14%, transparent));
                  transition:.16s; }
        .newbtn:hover { border-color:var(--ac); background:linear-gradient(160deg, color-mix(in srgb, var(--ac) 34%, transparent), color-mix(in srgb, var(--ac2) 20%, transparent)); }
        .newbtn svg { width:17px; height:17px; }
        .newfolder { flex:none; width:44px; height:44px; display:grid; place-items:center; cursor:pointer;
                     color:var(--muted); border:1px solid var(--line); border-radius:12px;
                     background:rgba(255,255,255,.03); transition:.16s; }
        .newfolder:hover { color:#fff; border-color:color-mix(in srgb, var(--ac2) 50%, transparent); background:color-mix(in srgb, var(--ac2) 12%, transparent); }
        .newfolder svg { width:18px; height:18px; }
        .list { flex:1; min-height:0; overflow-y:auto; padding:0 8px 12px;
                scrollbar-width:thin; scrollbar-color:color-mix(in srgb, var(--ac) 50%, transparent) transparent; }
        .list::-webkit-scrollbar { width:8px; }
        .list::-webkit-scrollbar-thumb { border-radius:99px;
                background:linear-gradient(180deg, var(--ac), color-mix(in srgb, var(--ac) 30%, transparent)); }

        .folder { margin-bottom:2px; }
        .folder-head { display:flex; align-items:center; gap:6px; padding:8px 8px 8px 10px;
                       margin-bottom:2px; border-radius:9px; cursor:pointer; user-select:none; }
        .folder-head:hover { background:rgba(255,255,255,.04); }
        .folder-head .car { flex:none; width:14px; height:14px; color:var(--muted);
                            transition:transform .15s; }
        .folder.collapsed .folder-head .car { transform:rotate(-90deg); }
        .folder-head .fname { flex:1; min-width:0; font-size:.76rem; font-weight:700; color:#cfd8ee;
                              white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .folder-head .fcount { flex:none; color:var(--muted); font-size:.66rem; }
        .folder-head .ficons { flex:none; display:flex; gap:2px; opacity:0; transition:.13s; }
        .folder-head:hover .ficons { opacity:1; }
        .folder-head .fic { width:20px; height:20px; display:grid; place-items:center; color:var(--muted);
                            border-radius:6px; font-size:.78rem; line-height:1; cursor:pointer; }
        .folder-head .fic:hover { color:#fff; background:rgba(255,255,255,.1); }
        .folder-head .fic.del:hover { color:#ff8a8a; background:rgba(255,90,90,.14); }
        .folder-body { padding-left:14px; }
        .folder.collapsed .folder-body { display:none; }
        .folder-empty { color:var(--muted); font-size:.66rem; padding:2px 10px 8px; }
        .folder-input { width:100%; height:32px; padding:0 9px; margin:0 0 6px; color:#f4f7ff;
                        font:600 .76rem inherit; border:1px solid var(--ac); border-radius:8px;
                        outline:none; background:rgba(4,9,20,.7); }

        .row { position:relative; display:flex; align-items:center; gap:8px; padding:9px 10px; margin-bottom:4px;
               border-radius:10px; cursor:pointer; border:1px solid transparent; transition:.13s; }
        .row:hover { background:rgba(255,255,255,.05); }
        .row.on { background:color-mix(in srgb, var(--ac) 16%, transparent); border-color:color-mix(in srgb, var(--ac) 40%, transparent); }
        .row .ico { width:8px; height:8px; flex:none; border-radius:50%; background:var(--ac2); opacity:.6; }
        .row .meta { flex:1; min-width:0; }
        .row .ttl { display:block; font-size:.8rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .row .ttl-input { width:100%; height:24px; padding:0 6px; color:#f4f7ff; font:600 .78rem inherit;
                          border:1px solid var(--ac); border-radius:6px; outline:none; background:rgba(4,9,20,.7); }
        .row .sub { display:block; margin-top:2px; color:var(--muted); font-size:.63rem; }
        .row .acts { flex:none; display:flex; gap:1px; opacity:0; transition:.13s; }
        .row:hover .acts { opacity:.75; }
        .row .acts:hover { opacity:1; }
        .row .ic { flex:none; width:23px; height:23px; display:grid; place-items:center;
                  color:var(--muted); border-radius:7px; transition:.13s; font-size:.86rem; line-height:1; }
        .row .ic:hover { color:#fff; background:rgba(255,255,255,.1); }
        .row .ic.x:hover { color:#ff8a8a; background:rgba(255,90,90,.12); }
        .row .ic svg { width:13px; height:13px; display:block; }
        .row .ic.pin.on { color:var(--warm); opacity:1; }
        .row.pinned .ic.pin { opacity:1; color:var(--warm); }
        .empty-list { color:var(--muted); font-size:.72rem; text-align:center; padding:24px 14px; line-height:1.6; }

        .fmenu { position:absolute; z-index:30; min-width:168px; padding:6px; color:#eaf0ff;
                border:1px solid var(--line); border-radius:11px; background:#10162a;
                box-shadow:0 12px 32px rgba(0,0,0,.5); }
        .fmenu button { display:flex; align-items:center; gap:8px; width:100%; padding:7px 9px;
                        color:#dbe2f5; font:400 .76rem inherit; text-align:left; border-radius:7px;
                        cursor:pointer; background:none; }
        .fmenu button:hover { background:rgba(255,255,255,.08); }
        .fmenu button.on { color:var(--ac); }
        .fmenu button .dot2 { flex:none; width:7px; height:7px; border-radius:50%; background:var(--ac2); opacity:.7; }
        .fmenu hr { margin:5px 2px; border:0; border-top:1px solid var(--line); }

        /* flex:1 обязателен: без него область чата в flex-строке .wrap
           сжимается до ширины своего содержимого (~820px) и липнет к
           сайдбару слева — тогда прокрутка чата оказывается «по центру»,
           а поле ввода не по центру экрана. С flex:1 .main занимает всё
           место справа от списка, а .chat/.field центрируются в нём. */
        .main { flex:1; display:flex; flex-direction:column; min-width:0; min-height:0; position:relative; }
        .chat { flex:1; min-height:0; overflow-y:auto; padding:clamp(14px,2.4vw,26px);
                display:flex; flex-direction:column; gap:16px;
                scrollbar-width:thin; scrollbar-color:color-mix(in srgb, var(--ac) 40%, transparent) transparent; }
        .chat::-webkit-scrollbar { width:9px; }
        .chat::-webkit-scrollbar-thumb { border-radius:99px; background:color-mix(in srgb, var(--ac) 35%, transparent); }
        .msg { display:flex; gap:12px; max-width:min(760px,100%); align-self:center; width:100%; }
        .msg .av { width:34px; height:34px; flex:none; border-radius:11px; display:grid;
                   place-items:center; font-size:.6rem; font-weight:800; color:#050a18;
                   background:linear-gradient(160deg, var(--ac2), var(--ac)); }
        .msg.me .av { color:#eef2fb; background:rgba(255,255,255,.08); border:1px solid var(--line); }
        .msg .bd { min-width:0; }
        .msg .txt { padding:12px 15px; border-radius:14px; font-size:.9rem; line-height:1.62;
                    background:rgba(255,255,255,.045); border:1px solid var(--line);
                    overflow-wrap:anywhere; }
        .msg.me { flex-direction:row-reverse; }
        .msg.me .txt { background:color-mix(in srgb, var(--ac) 14%, transparent); border-color:color-mix(in srgb, var(--ac) 30%, transparent); }
        .msg.err .txt { color:#ffb3b3; background:rgba(255,90,90,.1); border-color:rgba(255,90,90,.32); }
        .msg .txt img { max-width:260px; max-height:260px; border-radius:9px; display:block;
                        margin:0 0 8px; border:1px solid var(--line); }
        .msg .tools { display:flex; gap:5px; margin-top:4px; opacity:0; transition:.15s; }
        .msg:hover .tools, .msg .tools.stay { opacity:1; }
        .msg.me .tools { justify-content:flex-end; }
        .copy-btn, .note-btn { flex:none; display:flex; align-items:center; gap:5px; height:24px; padding:0 8px;
                    cursor:pointer; color:var(--muted); font:600 .64rem inherit; letter-spacing:.02em;
                    border:1px solid var(--line); border-radius:7px; background:rgba(255,255,255,.03); }
        .copy-btn:hover, .note-btn:hover { color:#fff; border-color:rgba(255,255,255,.28); background:rgba(255,255,255,.08); }
        .copy-btn.done { color:var(--ok); border-color:rgba(99,245,173,.4); }
        .copy-btn svg, .note-btn svg { width:12px; height:12px; }
        .regen-btn { flex:none; display:flex; align-items:center; gap:5px; height:24px; padding:0 8px;
                    cursor:pointer; color:var(--muted); font:600 .64rem inherit; letter-spacing:.02em;
                    border:1px solid var(--line); border-radius:7px; background:rgba(255,255,255,.03); }
        .regen-btn:hover { color:#fff; border-color:rgba(255,255,255,.28); background:rgba(255,255,255,.08); }
        .regen-btn svg { width:12px; height:12px; }
        .pdf-chip { display:flex; align-items:center; gap:8px; padding:8px 10px; margin:0 0 8px;
                    border-radius:9px; font-size:.76rem; color:#cfd8ee;
                    border:1px solid var(--line); background:rgba(255,255,255,.04); }
        .pdf-chip svg { flex:none; width:17px; height:17px; color:var(--ac); }
        .pdf-chip span { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
        .pdf-chip button { flex:none; cursor:pointer; color:var(--muted); background:none; border:0; font-size:1rem; }
        .pdf-chip button:hover { color:#ff8a8a; }
        .msg .pdf-tag { display:inline-flex; align-items:center; gap:6px; margin:0 0 8px; padding:5px 9px;
                        border-radius:8px; font-size:.72rem; color:#b9c6dc;
                        border:1px solid var(--line); background:rgba(255,255,255,.04); }
        .msg .pdf-tag svg { width:13px; height:13px; flex:none; }
        .think { margin:0 0 9px; border:1px solid var(--line); border-radius:10px;
                 background:rgba(255,255,255,.03); overflow:hidden; }
        .think-head { display:flex; align-items:center; gap:7px; padding:8px 11px;
                      cursor:pointer; user-select:none; color:var(--muted); font-size:.72rem; }
        .think-head:hover { color:#dbe2f5; }
        .think-head .tcar { width:12px; height:12px; flex:none; transition:transform .15s; }
        .think.open .think-head .tcar { transform:rotate(180deg); }
        .think-label { flex:1; font-weight:600; }
        .think.live .think-label::after { content:"…"; }
        .think-timer { flex:none; font-variant-numeric:tabular-nums; font-size:.68rem; }
        .think-body { display:none; padding:0 12px 11px; color:#9aa5c2; font-size:.78rem;
                      line-height:1.55; white-space:pre-wrap; overflow-wrap:anywhere;
                      max-height:260px; overflow-y:auto; }
        .think.open .think-body { display:block; }
        .msg .txt p:first-child { margin-top:0; } .msg .txt p:last-child { margin-bottom:0; }
        .txt pre { margin:9px 0; padding:11px 13px; overflow-x:auto; border-radius:10px;
                   background:rgba(3,7,18,.7); border:1px solid var(--line);
                   scrollbar-width:thin; }
        .txt pre code { font-size:.82rem; line-height:1.5; color:#d7e2ff; }
        .txt code { font-family:inherit; }
        .txt :not(pre) > code { padding:1px 6px; border-radius:6px; font-size:.84rem;
                   background:color-mix(in srgb, var(--ac2) 16%, transparent); color:#cfd6ff; }
        .txt a { color:#9db4ff; text-decoration:underline; text-underline-offset:2px; }
        .cursor::after { content:"▋"; margin-left:1px; color:var(--ac); animation:blink 1s steps(2) infinite; }
        @keyframes blink { 50% { opacity:0; } }
        .dots span { display:inline-block; width:6px; height:6px; margin-right:4px; border-radius:50%;
                     background:var(--ac); animation:blip 1.1s ease-in-out infinite; }
        .dots span:nth-child(2){ animation-delay:.18s } .dots span:nth-child(3){ animation-delay:.36s }
        @keyframes blip { 0%,100%{opacity:.25; transform:translateY(0)} 50%{opacity:1; transform:translateY(-3px)} }

        .hello { margin:auto; text-align:center; max-width:520px; padding:20px; }
        .hello h2 { margin:0 0 8px; font-size:1.35rem; font-weight:800;
                    background:linear-gradient(90deg, var(--ac2), var(--ac)); -webkit-background-clip:text;
                    background-clip:text; -webkit-text-fill-color:transparent; }
        .hello p { margin:0 0 18px; color:var(--muted); font-size:.82rem; line-height:1.6; }
        .seeds { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; }
        .seeds button { padding:9px 13px; cursor:pointer; color:#cfd8ee; font:400 .76rem inherit;
                        border:1px solid var(--line); border-radius:10px; background:rgba(255,255,255,.04);
                        transition:.15s; }
        .seeds button:hover { color:#fff; border-color:color-mix(in srgb, var(--ac) 50%, transparent); background:color-mix(in srgb, var(--ac) 12%, transparent); }

        .compose { flex:none; border-top:1px solid var(--line); padding:12px clamp(12px,2.4vw,26px) 14px;
                   background:rgba(8,12,24,.55); }
        .imgchip { display:inline-flex; align-items:center; gap:9px; margin-bottom:9px; padding:6px 9px;
                   border:1px solid var(--line); border-radius:10px; background:rgba(255,255,255,.04); }
        .imgchip img { width:34px; height:34px; object-fit:cover; border-radius:7px; }
        .imgchip button { cursor:pointer; color:var(--muted); background:none; border:0; font-size:1rem; }
        .imgchip button:hover { color:#ff8a8a; }
        .field { display:flex; align-items:flex-end; gap:9px; max-width:820px; margin:0 auto; }
        .attach { width:46px; height:46px; flex:none; display:grid; place-items:center; cursor:pointer;
                  color:var(--muted); border:1px solid var(--line); border-radius:13px;
                  background:rgba(255,255,255,.04); transition:.15s; }
        .attach:hover { color:var(--ac2); border-color:color-mix(in srgb, var(--ac2) 50%, transparent); }
        .attach svg { width:20px; height:20px; }
        .field textarea { flex:1; min-height:46px; max-height:190px; padding:12px 15px; resize:none;
                 color:#f4f7ff; font:400 .9rem inherit; line-height:1.5; border:1px solid var(--line);
                 border-radius:13px; outline:none; background:rgba(4,9,20,.65); }
        .field textarea:focus { border-color:var(--ac); }
        .send { width:46px; height:46px; flex:none; display:grid; place-items:center; cursor:pointer;
                color:#050a18; border:0; border-radius:13px;
                background:linear-gradient(160deg, var(--ac2), var(--ac)); transition:.15s; }
        .send:hover { filter:brightness(1.08); } .send:disabled { opacity:.4; cursor:not-allowed; }
        .send svg { width:20px; height:20px; }
        .send.stopmode { background:linear-gradient(160deg,#ff9b9b,#ff4d4d); }
        .note { max-width:820px; margin:8px auto 0; color:#5c6780; font-size:.66rem; text-align:center; line-height:1.5; }

        .scrim { display:none; }
        @media (max-width:760px) {
          .burger { display:grid; }
          .wrap { grid-template-columns:1fr; }
          .aside { position:absolute; z-index:20; top:0; bottom:0; left:0; width:min(300px,84vw);
                   transform:translateX(-104%); transition:transform .22s ease;
                   box-shadow:24px 0 60px rgba(0,0,0,.5); }
          .wrap.open .aside { transform:none; }
          .scrim { position:absolute; inset:0; z-index:15; background:rgba(2,5,12,.55); }
          .wrap.open .scrim { display:block; }
        }
        @media (prefers-reduced-motion: reduce) { * { animation:none !important; transition:none !important; } }

        /* Свои карточки вместо системных confirm/prompt/alert — в теме сайта */
        .ui-scrim { position:fixed; inset:0; z-index:60; display:flex; align-items:center;
                    justify-content:center; padding:16px; background:rgba(2,5,12,.6);
                    animation:ui-fade .15s ease; }
        @keyframes ui-fade { from { opacity:0; } to { opacity:1; } }
        .ui-modal { width:min(360px, 100%); padding:20px; border-radius:16px; color:#eef2fb;
                    border:1px solid color-mix(in srgb, var(--ac) 35%, var(--line));
                    background:#10162a;
                    box-shadow:0 20px 60px rgba(0,0,0,.5), 0 0 0 1px color-mix(in srgb, var(--ac) 12%, transparent);
                    animation:ui-pop .16s ease; }
        @keyframes ui-pop { from { transform:scale(.96); opacity:0; } to { transform:scale(1); opacity:1; } }
        .ui-modal p { margin:0 0 16px; font-size:.86rem; line-height:1.55; color:#dbe2f5; white-space:pre-line; }
        .ui-modal input { width:100%; height:42px; padding:0 12px; margin:0 0 16px; color:#f4f7ff;
                           font:400 .88rem inherit; border:1px solid var(--line); border-radius:10px;
                           outline:none; background:rgba(4,9,20,.65); }
        .ui-modal input:focus { border-color:var(--ac); }
        .ui-modal .ui-acts { display:flex; gap:8px; justify-content:flex-end; }
        .ui-modal button { height:38px; padding:0 16px; cursor:pointer; font:600 .8rem inherit;
                            border-radius:10px; border:1px solid var(--line);
                            background:rgba(255,255,255,.04); color:#cfd8ee; transition:.15s; }
        .ui-modal button:hover { color:#fff; background:rgba(255,255,255,.09); }
        .ui-modal button.ui-primary { color:#050a18; border-color:transparent;
                                       background:linear-gradient(160deg, var(--ac2), var(--ac)); }
        .ui-modal button.ui-primary:hover { filter:brightness(1.08); }
        .ui-modal button.ui-danger { color:#ffb3b3; border-color:color-mix(in srgb, #ff5a5a 40%, transparent);
                                      background:color-mix(in srgb, #ff5a5a 12%, transparent); }
        .ui-modal button.ui-danger:hover { background:color-mix(in srgb, #ff5a5a 22%, transparent); }

        .ui-toasts { position:fixed; z-index:70; left:50%; bottom:22px; transform:translateX(-50%);
                     display:flex; flex-direction:column; gap:8px; align-items:center; pointer-events:none; }
        .ui-toast { pointer-events:auto; padding:10px 15px; border-radius:11px; font-size:.8rem;
                    color:#eef2fb; max-width:min(420px,86vw); text-align:center;
                    border:1px solid var(--line); background:#10162a;
                    box-shadow:0 10px 30px rgba(0,0,0,.4); animation:ui-toast-in .18s ease; transition:opacity .25s; }
        .ui-toast.err { border-color:color-mix(in srgb, #ff5a5a 40%, transparent); color:#ffb3b3; }
        .ui-toast.ok { border-color:color-mix(in srgb, var(--ok) 40%, transparent); }
        @keyframes ui-toast-in { from { transform:translateY(8px); opacity:0; } to { transform:translateY(0); opacity:1; } }
      </style>
    </head>
    <body>
      <div class="bar">
        <a class="back" href="/cabinet" title="В кабинет" aria-label="В кабинет"><svg viewBox="0 0 24 24" fill="none"><path d="M19 12H5m0 0 6-6m-6 6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
        <button class="burger" id="burger" type="button" aria-label="Список чатов"><svg viewBox="0 0 24 24" fill="none"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
        <div class="brand"><b id="brand-name">Нейросеть</b><span id="brand-sub"><i class="dot"></i>проверяю связь…</span></div>
      </div>

      <div class="wrap" id="wrap">
        <div class="scrim" id="scrim"></div>
        <aside class="aside">
          <div class="newrow">
            <button class="newbtn" id="newbtn" type="button">
              <svg viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
              Новый чат
            </button>
            <button class="newfolder" id="newfolder" type="button" title="Новая папка" aria-label="Новая папка">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/><path d="M12 12v5M9.5 14.5h5"/></svg>
            </button>
            <button class="sidebtn" id="sidebtn-close" type="button" title="Свернуть список чатов" aria-label="Свернуть список чатов">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg>
            </button>
          </div>
          <div class="search-row" id="search-row">
            <input type="text" id="search" placeholder="Поиск по чатам…" autocomplete="off">
            <span class="sic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg></span>
            <span class="sclear" id="search-clear" title="Очистить">✕</span>
          </div>
          <div class="list" id="list"></div>
        </aside>

        <button class="sidebtn sideopen" id="sidebtn-open" type="button" title="Показать список чатов" aria-label="Показать список чатов">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg>
        </button>

        <main class="main">
          <div class="chat" id="chat"></div>
          <div class="compose">
            <div id="chip-slot"></div>
            <form class="field" id="field">
              <label class="attach" id="attach" title="Прикрепить фото (можно несколько, и Ctrl+V из буфера)" hidden>
                <svg viewBox="0 0 24 24" fill="none"><path d="M21 12.5 12.5 21a5 5 0 0 1-7-7l8-8a3.5 3.5 0 0 1 5 5l-8 8a2 2 0 0 1-3-3l7.5-7.5" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>
                <input type="file" id="file" accept="image/*" multiple hidden>
              </label>
              <label class="attach" id="attach-pdf" title="Прикрепить PDF">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6"/></svg>
                <input type="file" id="filepdf" accept="application/pdf" hidden>
              </label>
              <textarea id="text" rows="1" placeholder="Напишите сообщение…" aria-label="Сообщение"></textarea>
              <button class="send" id="send" type="submit" title="Отправить" aria-label="Отправить">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h15m0 0-6-6m6 6-6 6"/></svg>
              </button>
            </form>
            <p class="note" id="note">История этих чатов хранится на сайте под паролем кабинета. Модель — в облаке, дома ничего не грузит.</p>
          </div>
        </main>
      </div>

      <script>
      window.__PRESET__ = "%%PRESET%%";
      (() => {
        "use strict";
        const $ = (id) => document.getElementById(id);
        const chat = $("chat"), list = $("list"), wrap = $("wrap");
        const PRESET = window.__PRESET__ || "";
        // Две буквы для аватарки собеседника: по названию МОДЕЛИ, ОТВЕТИВШЕЙ
        // именно на это сообщение (а не по текущей вкладке) — иначе при
        // переключении вкладок аватарки старых сообщений скакали бы.
        const avaFor = (m) => {
          const s = m || PRESET;
          return /minimax/i.test(s) ? "MM"
               : /nvidia|nemotron/i.test(s) ? "NV"
               : /qwen/i.test(s) ? "QW"
               : /gemma|google/i.test(s) ? "GM"
               : /llama|meta/i.test(s) ? "LL"
               : /deepseek/i.test(s) ? "DS" : "AI";
        };
        // Цвет аватарки — тоже по РЕАЛЬНО ответившей модели, не по вкладке:
        // иначе старый ответ MiniMax, открытый из вкладки NVIDIA (или
        // наоборот), красился в чужой цвет текущей темы страницы — буквы
        // говорили одно, а цвет другое.
        const AV_COLORS = { MM: ["#ff3d9a", "#ff8fc4"], NV: ["#76c900", "#39ff14"] };
        const avColorFor = (code) => {
          const c = AV_COLORS[code];
          return c ? "linear-gradient(160deg, " + c[1] + ", " + c[0] + ")" : "";
        };
        let chats = [], folders = [], curId = null, busy = false, ready = false, vision = false, modelName = PRESET;
        let pendImgs = [], pendPdf = null, pendPdfName = "";
        const IMG_MAX_COUNT = 6;
        let curAbort = null, searchQ = "";
        let foldedSet = new Set();
        try { foldedSet = new Set(JSON.parse(localStorage.getItem("aiFolded") || "[]")); } catch (e) {}
        const saveFolded = () => { try { localStorage.setItem("aiFolded", JSON.stringify([...foldedSet])); } catch (e) {} };

        const ICON_COPY = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>';
        const ICON_CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';
        const ICON_MOVE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/></svg>';
        const ICON_PIN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v6.5M8 8.5h8l1.5 5H6.5l1.5-5ZM12 13.5V22"/></svg>';
        const ICON_REGEN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 4v5h-5"/></svg>';
        const ICON_NOTE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3v4a1 1 0 0 0 1 1h4"/><path d="M17 21H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7l5 5v11a2 2 0 0 1-2 2Z"/><path d="M9 13h6M9 17h6"/></svg>';
        const ICON_STOP = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>';
        const ICON_SEND = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h15m0 0-6-6m6 6-6 6"/></svg>';
        const ICON_PDF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6"/><path d="M9.5 13.2h1.1c.7 0 1.2.5 1.2 1.2s-.5 1.2-1.2 1.2H9.5v2M13.8 17.6v-4.4h1c1 0 1.7.9 1.7 2.2s-.7 2.2-1.7 2.2h-1ZM17.5 17.6v-4.4h2M17.5 15.4h1.6"/></svg>';

        const copyMsg = async (btn, text) => {
          if (!text) return;
          try {
            if (navigator.clipboard && navigator.clipboard.writeText) {
              await navigator.clipboard.writeText(text);
            } else {
              const ta = document.createElement("textarea");
              ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
              document.body.appendChild(ta); ta.focus(); ta.select();
              document.execCommand("copy"); ta.remove();
            }
            btn.classList.add("done");
            btn.innerHTML = ICON_CHECK + "<span>Скопировано</span>";
            setTimeout(() => { btn.classList.remove("done"); btn.innerHTML = ICON_COPY + "<span>Копировать</span>"; }, 1400);
          } catch (e) {}
        };

        const esc = (s) => (s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

        // Свои карточки вместо системных confirm()/prompt()/alert() — те
        // выглядят как окно браузера, а не часть сайта.
        const uiToasts = document.createElement("div");
        uiToasts.className = "ui-toasts";
        document.body.appendChild(uiToasts);
        const uiToast = (text, kind) => {
          const t = document.createElement("div");
          t.className = "ui-toast" + (kind ? " " + kind : "");
          t.textContent = text;
          uiToasts.appendChild(t);
          setTimeout(() => { t.style.opacity = "0"; setTimeout(() => t.remove(), 260); }, 2400);
        };
        const uiModal = ({ text, input, okLabel, okKind, cancelLabel }) => new Promise((resolve) => {
          const scrim = document.createElement("div");
          scrim.className = "ui-scrim";
          const box = document.createElement("div");
          box.className = "ui-modal";
          const p = document.createElement("p");
          p.textContent = text;
          box.appendChild(p);
          let inputEl = null;
          if (input) {
            inputEl = document.createElement("input");
            inputEl.type = "text";
            inputEl.value = input.value || "";
            inputEl.placeholder = input.placeholder || "";
            if (input.maxLength) inputEl.maxLength = input.maxLength;
            box.appendChild(inputEl);
          }
          const acts = document.createElement("div");
          acts.className = "ui-acts";
          const cancelBtn = document.createElement("button");
          cancelBtn.type = "button"; cancelBtn.textContent = cancelLabel || "Отмена";
          const okBtn = document.createElement("button");
          okBtn.type = "button"; okBtn.className = okKind === "danger" ? "ui-danger" : "ui-primary";
          okBtn.textContent = okLabel || "ОК";
          const finish = (val) => { scrim.remove(); document.removeEventListener("keydown", onKey); resolve(val); };
          cancelBtn.addEventListener("click", () => finish(input ? null : false));
          okBtn.addEventListener("click", () => finish(input ? inputEl.value.trim() : true));
          const onKey = (e) => {
            if (e.key === "Escape") finish(input ? null : false);
            else if (e.key === "Enter" && document.activeElement !== cancelBtn) {
              e.preventDefault(); finish(input ? inputEl.value.trim() : true);
            }
          };
          acts.append(cancelBtn, okBtn);
          box.appendChild(acts);
          scrim.appendChild(box);
          scrim.addEventListener("click", (e) => { if (e.target === scrim) finish(input ? null : false); });
          document.body.appendChild(scrim);
          document.addEventListener("keydown", onKey);
          if (inputEl) { inputEl.focus(); inputEl.select(); } else okBtn.focus();
        });
        const uiConfirm = (text, opts) => uiModal({ text, okLabel: (opts && opts.okLabel) || "Удалить",
                                                     okKind: "danger", cancelLabel: "Отмена" });
        const uiPrompt = (text, opts) => uiModal({ text, input: opts || {}, okLabel: "ОК" });

        // Небольшой безопасный markdown: сначала прячем блоки кода, экранируем
        // остальное, потом возвращаем стили. Так теги из ответа не выполнятся.
        const md = (src) => {
          const blocks = [];
          let t = (src || "").replace(/```([\s\S]*?)```/g, (m, code) => {
            let body = code.replace(/^[a-zA-Z0-9_+.-]*\n/, "");
            blocks.push("<pre><code>" + esc(body.replace(/\s+$/, "")) + "</code></pre>");
            return "" + (blocks.length - 1) + "";
          });
          t = esc(t);
          t = t.replace(/`([^`]+)`/g, "<code>$1</code>");
          t = t.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
          t = t.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,
                        (m, txt, url) => '<a href="' + url + '" target="_blank" rel="noopener">' + txt + "</a>");
          t = t.replace(/^(\s*)[-*] +/gm, "$1• ");
          t = t.replace(/\n/g, "<br>");
          t = t.replace(/(\d+)/g, (m, i) => blocks[+i]);
          return t;
        };

        const ago = (ts) => {
          if (!ts) return "";
          const s = Math.max(0, Date.now() / 1000 - ts);
          if (s < 60) return "только что";
          if (s < 3600) return Math.floor(s / 60) + " мин";
          if (s < 86400) return Math.floor(s / 3600) + " ч";
          if (s < 604800) return Math.floor(s / 86400) + " дн";
          return new Date(ts * 1000).toLocaleDateString("ru-RU");
        };

        const scrollDown = () => { chat.scrollTop = chat.scrollHeight; };

        // Кнопка «Перегенерировать» имеет смысл только на самом последнем
        // ответе — регенерация на бэке всегда стирает последнюю реплику
        // ассистента. Держим ссылку на неё, чтобы прятать со старой при
        // появлении новой.
        let lastRegenBtn = null;

        // Блок «размышлений» (reasoning) — общий для живого стриминга
        // (runStream) и статичного показа истории (bubble).
        const ICON_TCAR = '<svg class="tcar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>';
        const fmtSecs = (s) => (Math.round((s || 0) * 10) / 10) + " с";
        const newThink = () => {
          const think = document.createElement("div");
          think.className = "think";
          think.innerHTML = '<div class="think-head">' + ICON_TCAR +
            '<span class="think-label">Думает</span><span class="think-timer">0 с</span></div>' +
            '<div class="think-body"></div>';
          think.querySelector(".think-head").addEventListener("click", () => think.classList.toggle("open"));
          return think;
        };

        const bubble = (role, html, cls, raw, opts) => {
          opts = opts || {};
          const el = document.createElement("div");
          el.className = "msg " + (role === "me" ? "me" : "bot") + (cls ? " " + cls : "");
          const av = document.createElement("span");
          av.className = "av";
          if (role === "me") { av.textContent = "Я"; }
          else {
            const code = avaFor(opts.model);
            av.textContent = code;
            const bg = avColorFor(code);
            if (bg) av.style.background = bg;
          }
          const bd = document.createElement("div");
          bd.className = "bd";
          if (opts.pdfName) {
            const tag = document.createElement("div");
            tag.className = "pdf-tag";
            tag.innerHTML = ICON_PDF + "<span>" + esc(opts.pdfName) + "</span>";
            bd.appendChild(tag);
          }
          if (opts.think && opts.think.text) {
            const think = newThink();
            think.querySelector(".think-label").textContent = "Думал";
            think.querySelector(".think-timer").textContent = fmtSecs(opts.think.secs);
            think.querySelector(".think-body").textContent = opts.think.text;
            bd.appendChild(think);
          }
          const tx = document.createElement("div");
          tx.className = "txt";
          if (html === null) tx.innerHTML = '<span class="dots"><span></span><span></span><span></span></span>';
          else tx.innerHTML = html;
          bd.appendChild(tx);
          if (raw != null) {
            tx.dataset.raw = raw;
            const tools = document.createElement("div");
            tools.className = "tools";
            const cp = document.createElement("button");
            cp.type = "button"; cp.className = "copy-btn";
            cp.innerHTML = ICON_COPY + "<span>Копировать</span>";
            cp.addEventListener("click", () => copyMsg(cp, tx.dataset.raw));
            tools.appendChild(cp);
            if (role !== "me") {
              const nb = document.createElement("button");
              nb.type = "button"; nb.className = "note-btn";
              nb.innerHTML = ICON_NOTE + "<span>В блокнот</span>";
              nb.addEventListener("click", () => saveToNotebook(tx.dataset.raw));
              tools.appendChild(nb);
              if (opts.regen) {
                const rb = document.createElement("button");
                rb.type = "button"; rb.className = "regen-btn";
                rb.innerHTML = ICON_REGEN + "<span>Заново</span>";
                rb.addEventListener("click", () => regenerate(el));
                tools.appendChild(rb);
                if (lastRegenBtn) lastRegenBtn.remove();
                lastRegenBtn = rb;
              }
            }
            bd.appendChild(tools);
          }
          el.append(av, bd);
          chat.appendChild(el);
          scrollDown();
          return tx;
        };

        const saveToNotebook = async (text) => {
          if (!text) return;
          const title = ((await uiPrompt("Название записи в блокноте:",
                          { placeholder: "Например: важная мысль", maxLength: 160 })) || "").trim().slice(0, 160);
          if (!title) return;
          try {
            const r = await fetch("/api/notebook/entry", { method: "POST", credentials: "same-origin",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ type: "text", title: title, text: text }) });
            if (!r.ok) { uiToast("Не удалось сохранить в блокнот.", "err"); return; }
            uiToast("Сохранено в блокнот.", "ok");
          } catch (e) { uiToast("Не удалось сохранить в блокнот.", "err"); }
        };

        const showHello = () => {
          chat.innerHTML = "";
          const box = document.createElement("div");
          box.className = "hello";
          box.innerHTML = '<h2>Чат с нейросетью</h2>' +
            '<p>' + (ready
              ? "Спрашивайте что угодно — модель " + esc(modelName) + " отвечает через OpenRouter. Разговор сохранится слева."
              : "Ключ OpenRouter на сервере пока не задан, поэтому отвечать нечем. Как получить ключ — в инструкции у хозяина.") + '</p>' +
            '<div class="seeds">' +
              '<button type="button">Объясни простыми словами, что такое нейросеть</button>' +
              '<button type="button">Придумай план на выходные</button>' +
              '<button type="button">Помоги написать письмо</button>' +
              '<button type="button">Дай рецепт из того, что есть в холодильнике</button>' +
            '</div>';
          chat.appendChild(box);
          box.querySelectorAll("button").forEach((b) => b.addEventListener("click", () => {
            $("text").value = b.textContent;
            grow();
            submit();
          }));
        };

        const closeFMenu = () => { const m = document.querySelector(".fmenu"); if (m) m.remove(); };

        const askNewFolder = async (chatToMove) => {
          const name = ((await uiPrompt("Название новой папки:",
                         { placeholder: "Например: Работа", maxLength: 40 })) || "").trim().slice(0, 40);
          if (!name) return;
          try {
            const r = await fetch("/api/ai/folder", { method: "POST", credentials: "same-origin",
              headers: { "Content-Type": "application/json" }, body: JSON.stringify({ name }) });
            const d = await r.json();
            if (!r.ok) { uiToast(d.error || "Не удалось создать папку.", "err"); return; }
            folders.push({ id: d.id, name: d.name });
            if (chatToMove) await moveChat(chatToMove, d.id); else renderList();
          } catch (e) {}
        };

        const moveChat = async (c, fid) => {
          c.folder = fid;
          renderList();
          try {
            await fetch("/api/ai/chat/" + c.id, { method: "PATCH", credentials: "same-origin",
              headers: { "Content-Type": "application/json" }, body: JSON.stringify({ folder: fid }) });
          } catch (e) {}
        };

        const togglePin = async (c) => {
          c.pinned = !c.pinned;
          renderList();
          try {
            await fetch("/api/ai/chat/" + c.id, { method: "PATCH", credentials: "same-origin",
              headers: { "Content-Type": "application/json" }, body: JSON.stringify({ pinned: c.pinned }) });
          } catch (e) {}

        const openFolderMenu = (anchor, c) => {
          closeFMenu();

          menu.appendChild(document.createElement("hr"));
          menu.appendChild(mkBtn("+ Новая папка…", false, () => askNewFolder(c)));
          document.body.appendChild(menu);

        const startRename = (row, c) => {
          closeFMenu();

          input.className = "ttl-input";
          input.value = c.title;

          const save = async () => {
            if (done) return;
            done = true;
            const val = input.value.trim().slice(0, 80) || "Новый чат";
            ttl.textContent = val;
            input.replaceWith(ttl);
            if (val === c.title) return;
            c.title = val;
            try {
              await fetch("/api/ai/chat/" + c.id, { method: "PATCH", credentials: "same-origin",
                headers: { "Content-Type": "application/json" }, body: JSON.stringify({ title: val }) });
            } catch (e) {}
          };
          input.addEventListener("keydown", (e) => {
            if (e.key === "Enter") { e.preventDefault(); save(); }
            else if (e.key === "Escape") { done = true; input.replaceWith(ttl); }
          });
          input.addEventListener("blur", save);
          input.addEventListener("click", (e) => e.stopPropagation());
        };

        const startFolderRename = (head, f) => {

          input.className = "folder-input";
          input.value = f.name;

          input.focus(); input.select();
          let done = false;
          const save = async () => {
            if (done) return;
            done = true;
            const val = input.value.trim().slice(0, 40) || f.name;
            nameEl.textContent = val;
            input.replaceWith(nameEl);
            if (val === f.name) return;
            f.name = val;
            try {
              await fetch("/api/ai/folder/" + f.id, { method: "PATCH", credentials: "same-origin",
                headers: { "Content-Type": "application/json" }, body: JSON.stringify({ name: val }) });
            } catch (e) {}
          };
          input.addEventListener("keydown", (e) => {
            if (e.key === "Enter") { e.preventDefault(); save(); }

        const delFolder = async (f) => {
          const ok = await uiConfirm('Удалить папку «' + f.name + '»?\nЧаты внутри останутся — просто выйдут из папки.');
          if (!ok) return;

        const folderBlock = (f, mine) => {
          const wrap = document.createElement("div");

          const head = document.createElement("div");
          head.className = "folder-head";

            '<span class="fname">' + esc(f.name) + '</span>' +
            '<span class="fcount">' + mine.length + '</span>' +
            '<span class="ficons"><span class="fic ren" title="Переименовать">✎</span><span class="fic del" title="Удалить папку">✕</span></span>';
          head.addEventListener("click", (e) => {

        const renderList = () => {
          list.innerHTML = "";
          if (!chats.length && !folders.length) {
            list.innerHTML = '<div class="empty-list">Пока пусто.<br>Нажмите «Новый чат».</div>';
            return;
          }
          const q = searchQ.trim().toLowerCase();
          const visible = q ? chats.filter((c) => c.title.toLowerCase().includes(q)) : chats;
          if (q && !visible.length) {
            list.innerHTML = '<div class="empty-list">Ничего не нашлось.</div>';
            return;
          }
          const pinned = visible.filter((c) => c.pinned);
          const rest0 = visible.filter((c) => !c.pinned);
          if (pinned.length) {
            const ph = document.createElement("div");
            ph.className = "pin-sect";
            ph.textContent = "Закреплённые";
            list.appendChild(ph);
            pinned.forEach((c) => list.appendChild(makeRow(c)));
          }
          const rest = rest0.filter((c) => !c.folder || !folders.some((f) => f.id === c.folder));
          folders.forEach((f) => {
            const mine = rest0.filter((c) => c.folder === f.id);

            const head = document.createElement("div");

            list.appendChild(head);

          rest.forEach((c) => list.appendChild(makeRow(c)));

        const closeDrawer = () => wrap.classList.remove("open");

        const loadState = async () => {
          try {
            const r = await fetch("/api/ai/state", { credentials: "same-origin" });
            const d = await r.json();
            ready = !!d.ready; vision = !!d.vision; modelName = d.model || "";
            chats = d.chats || [];
            folders = d.folders || [];
            const shownModel = PRESET || modelName;
            const family = /minimax/i.test(shownModel) ? "MiniMax"
                         : /nvidia|nemotron/i.test(shownModel) ? "NVIDIA"
                         : /qwen/i.test(shownModel) ? "Qwen"
                         : /gemma|google/i.test(shownModel) ? "Gemma"
                         : /llama|meta/i.test(shownModel) ? "Llama"
                         : /deepseek/i.test(shownModel) ? "DeepSeek" : "Нейросеть";
            const nameEl = $("brand-name"); if (nameEl) nameEl.textContent = family;
            $("brand-sub").innerHTML = '<i class="dot ' + (ready ? "on" : "off") + '"></i>' +
              (ready ? esc(shownModel) : "ключ OpenRouter не задан");
            $("attach").hidden = !(ready && vision);
            renderList();
            if (chats.length) openChat(chats[0].id);
            else showHello();
          } catch (e) {
            $("brand-sub").innerHTML = '<i class="dot off"></i>не отвечает';
          }
        };

        const newChat = async () => {
          if (!ready) return;
          try {
            const r = await fetch("/api/ai/chat", { method: "POST", credentials: "same-origin" });
            const d = await r.json();
            chats.unshift({ id: d.id, title: d.title, count: 0, updated: Date.now() / 1000, folder: "" });
            curId = d.id;
            renderList();
            chat.innerHTML = "";
            showHello();
            closeDrawer();
            $("text").focus();
          } catch (e) {}
        };

        const openChat = async (id) => {
          curId = id;
          renderList();
          closeDrawer();
          lastRegenBtn = null;
          chat.innerHTML = '<div class="hello"><p>Загружаю…</p></div>';
          try {
            const r = await fetch("/api/ai/chat/" + id, { credentials: "same-origin" });
            const d = await r.json();
            chat.innerHTML = "";
            if (!d.messages || !d.messages.length) { showHello(); return; }
            d.messages.forEach((m, idx) => {
              const isMe = m.role === "user";
              let html = "";
              (m.imgs || []).forEach((iid) => {
                html += '<img src="/api/ai/img/' + encodeURIComponent(iid) + '" alt="фото">';
              });
              html += isMe ? esc(m.text).replace(/\n/g, "<br>") : md(m.text);
              const isLastBot = !isMe && idx === d.messages.length - 1;
              bubble(isMe ? "me" : "bot", html, undefined, m.text || "",
                     { model: m.model, pdfName: isMe ? m.pdf_name : "", regen: isLastBot,
                       think: (!isMe && m.reasoning) ? { text: m.reasoning, secs: m.reasoning_secs } : null });
            });
          } catch (e) {
            chat.innerHTML = "";
            bubble("bot", "Не удалось открыть чат.", "err");
          }
        };

        const delChat = async (id) => {
          const ok = await uiConfirm("Удалить этот чат целиком?");
          if (!ok) return;
          try {
            await fetch("/api/ai/chat/" + id, { method: "DELETE", credentials: "same-origin" });
          } catch (e) {}
          chats = chats.filter((c) => c.id !== id);
          if (curId === id) { curId = null; chat.innerHTML = ""; }
          if (chats.length && !curId) openChat(chats[0].id);
          else if (!chats.length) { curId = null; showHello(); }
          renderList();
        };

        const bumpCard = () => {
          const c = chats.find((x) => x.id === curId);
          if (c) { c.updated = Date.now() / 1000; c.count = (c.count || 0) + 1; }
          chats.sort((a, b) => b.updated - a.updated);
          renderList();
        };

        // Стоп/отправить — одна и та же кнопка, меняем только вид и обработку.
        const setBusy = (b) => {
          busy = b;
          const btn = $("send");
          btn.classList.toggle("stopmode", b);
          btn.title = b ? "Остановить" : "Отправить";
          btn.setAttribute("aria-label", b ? "Остановить" : "Отправить");
          btn.innerHTML = b ? ICON_STOP : ICON_SEND;
        };
        const stopGen = () => { if (curAbort) curAbort.abort(); };

        // Общий стрим-цикл для отправки нового сообщения и «Перегенерировать»:
        // читает SSE, копит текст, ловит «Стоп» через AbortController — то,
        // что успело прийти, остаётся на экране (сервер сам сохранит частичный
        // ответ через свой finally на GeneratorExit).
        const runStream = async (url, body, out) => {
          curAbort = new AbortController();
          // Живой блок размышлений: создаётся лениво на первый reasoning-кусок,
          // тикает таймер, на первом куске самого ответа — сворачивается,
          // подпись меняется на «Думал», таймер замирает на финальном числе.
          let thinkEl = null, thinkBody = null, thinkTimer = null;
          let thinkStart = 0, thinkTick = null, thinkDone = false;
          const ensureThink = () => {
            if (thinkEl) return;
            thinkStart = Date.now();
            thinkEl = newThink();
            thinkEl.classList.add("open", "live");
            out.parentElement.insertBefore(thinkEl, out);
            thinkBody = thinkEl.querySelector(".think-body");
            thinkTimer = thinkEl.querySelector(".think-timer");
            thinkTick = setInterval(() => {
              thinkTimer.textContent = fmtSecs((Date.now() - thinkStart) / 1000);
            }, 400);
          };
          const finishThink = () => {
            if (!thinkEl || thinkDone) return;
            thinkDone = true;
            if (thinkTick) { clearInterval(thinkTick); thinkTick = null; }
            thinkTimer.textContent = fmtSecs((Date.now() - thinkStart) / 1000);
            thinkEl.querySelector(".think-label").textContent = "Думал";
            thinkEl.classList.remove("open", "live");
          };
          try {
            const r = await fetch(url, {
              method: "POST", credentials: "same-origin",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(body), signal: curAbort.signal,
            });
            if (!r.ok || !r.body) {
              const d = await r.json().catch(() => ({}));
              out.parentElement.parentElement.classList.add("err");
              out.textContent = d.error || "Не удалось отправить.";
              return;
            }
            const reader = r.body.getReader();
            const dec = new TextDecoder();
            let buf = "", acc = "";
            out.classList.add("cursor");
            for (;;) {
              const { value, done } = await reader.read();
              if (done) break;
              buf += dec.decode(value, { stream: true });
              let i;
              while ((i = buf.indexOf("\n\n")) >= 0) {
                const frame = buf.slice(0, i); buf = buf.slice(i + 2);
                const line = frame.split("\n").find((l) => l.startsWith("data:"));
                if (!line) continue;
                let ev;
                try { ev = JSON.parse(line.slice(5).trim()); } catch (e) { continue; }
                if (ev.title) {
                  const cc = chats.find((x) => x.id === curId);
                  if (cc && cc.title !== ev.title) { cc.title = ev.title; renderList(); }
                }
                else if (ev.model) {
                  modelName = ev.model; $("brand-sub").innerHTML = '<i class="dot on"></i>' + esc(modelName);
                  const avEl = out.closest(".msg").querySelector(".av");
                  if (avEl) {
                    const code = avaFor(ev.model);
                    avEl.textContent = code;
                    avEl.style.background = avColorFor(code);
                  }
                }
                else if (ev.reasoning) {
                  ensureThink();
                  thinkBody.textContent += ev.reasoning;
                  thinkBody.scrollTop = thinkBody.scrollHeight;
                  scrollDown();
                }
                else if (ev.delta) {
                  finishThink();
                  acc += ev.delta; out.innerHTML = md(acc); out.dataset.raw = acc; scrollDown();
                }
                else if (ev.error) {
                  out.classList.remove("cursor");
                  finishThink();
                  out.parentElement.parentElement.classList.add("err");
                  out.textContent = ev.error;
                }
                else if (ev.done && ev.text) { finishThink(); acc = ev.text; out.innerHTML = md(acc); out.dataset.raw = acc; }
              }
            }
            out.classList.remove("cursor");
            finishThink();
            if (!acc && !out.textContent) out.textContent = "Пустой ответ.";
            bumpCard();
          } catch (e) {
            out.classList.remove("cursor");
            finishThink();
            if (e.name === "AbortError") {
              if (!out.dataset.raw && !out.textContent) out.textContent = "Остановлено.";
            } else {
              out.parentElement.parentElement.classList.add("err");
              out.textContent = "Оборвалась связь с сервером.";
            }
          } finally {
            curAbort = null;
          }
        };

        const regenerate = async (el) => {
          if (busy || !ready || !curId) return;
          busy = true; setBusy(true);
          el.remove();
          const out = bubble("bot", null, undefined, "", { regen: true });
          await runStream("/api/ai/chat/" + curId + "/regenerate",
                           { model: PRESET || undefined }, out);
          setBusy(false);
        };

        const submit = async () => {
          if (busy || !ready) return;
          const ta = $("text");
          const text = ta.value.trim();
          const imgs = pendImgs.slice();
          const pdf = pendPdf, pdfName = pendPdfName;
          if (!text && !imgs.length && !pdf) return;
          if (!curId) { await newChat(); }
          if (!curId) return;

          // если открыт экран-приветствие — очищаем его перед первой репликой
          if (chat.querySelector(".hello")) chat.innerHTML = "";

          busy = true; setBusy(true);
          let meHtml = "";
          imgs.forEach((src) => { meHtml += '<img src="' + src + '" alt="фото">'; });
          if (text) meHtml += esc(text).replace(/\n/g, "<br>");
          bubble("me", meHtml, undefined, text, { pdfName: pdf ? pdfName : "" });
          ta.value = ""; grow(); clearImg(); clearPdf();
          bumpCard();
          const out = bubble("bot", null, undefined, "", { regen: true });

          await runStream("/api/ai/chat/" + curId + "/send", {
            text: text, images: imgs.length ? imgs : undefined,
            pdf: pdf || undefined, pdf_name: pdf ? pdfName : undefined,
            model: PRESET || undefined,
          }, out);

          setBusy(false); $("text").focus();
        };

        // ── ввод ──
        const grow = () => { const ta = $("text"); ta.style.height = "auto"; ta.style.height = Math.min(190, ta.scrollHeight) + "px"; };
        $("text").addEventListener("input", grow);
        $("text").addEventListener("keydown", (e) => {
          if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); if (!busy) submit(); }
        });
        $("field").addEventListener("submit", (e) => {
          e.preventDefault();
          if (busy) stopGen(); else submit();
        });
        $("newbtn").addEventListener("click", newChat);
        $("newfolder").addEventListener("click", () => askNewFolder(null));
        $("burger").addEventListener("click", () => wrap.classList.toggle("open"));
        $("scrim").addEventListener("click", closeDrawer);

        // ── сайдбар: сворачивание, запоминаем на этой машине ──
        let sideCollapsed = false;
        try { sideCollapsed = localStorage.getItem("aiSidebarCollapsed") === "1"; } catch (e) {}
        if (sideCollapsed) wrap.classList.add("collapsed");
        const toggleSidebar = () => {
          sideCollapsed = !sideCollapsed;
          wrap.classList.toggle("collapsed", sideCollapsed);
          try { localStorage.setItem("aiSidebarCollapsed", sideCollapsed ? "1" : "0"); } catch (e) {}
        };
        $("sidebtn-close").addEventListener("click", toggleSidebar);
        $("sidebtn-open").addEventListener("click", toggleSidebar);

        // ── поиск по чатам ──
        const searchInput = $("search"), searchRow = $("search-row"), searchClear = $("search-clear");
        searchInput.addEventListener("input", () => {
          searchQ = searchInput.value;
          searchRow.classList.toggle("filled", !!searchQ);
          renderList();
        });
        searchClear.addEventListener("click", () => {
          searchInput.value = ""; searchQ = "";
          searchRow.classList.remove("filled");
          renderList(); searchInput.focus();
        });

        // ── вложение в поле ввода: несколько фото ЛИБО один PDF ──
        const renderChipSlot = () => {
          const slot = $("chip-slot");
          slot.innerHTML = "";
          if (pendImgs.length) {
            pendImgs.forEach((src, i) => {
              const chip = document.createElement("div");
              chip.className = "imgchip";
              chip.innerHTML = '<img alt=""><span>фото ' + (i + 1) + '</span>' +
                '<button type="button" title="Убрать">✕</button>';
              chip.querySelector("img").src = src;
              chip.querySelector("button").addEventListener("click", () => {
                pendImgs.splice(i, 1); $("file").value = ""; renderChipSlot();
              });
              slot.appendChild(chip);
            });
          } else if (pendPdf) {
            const chip = document.createElement("div");
            chip.className = "pdf-chip";
            chip.innerHTML = ICON_PDF + "<span>" + esc(pendPdfName) + "</span><button type=\"button\" title=\"Убрать\">✕</button>";
            chip.querySelector("button").addEventListener("click", clearPdf);
            slot.appendChild(chip);
          }
        };

        // ── фото: ужимаем в браузере, чтобы не гонять гигантские файлы ──
        const clearImg = () => { pendImgs = []; $("file").value = ""; renderChipSlot(); };
        // Одна картинка (File или Blob) → ужать → добавить в список.
        const addImage = (file) => new Promise((resolve) => {
          if (pendImgs.length >= IMG_MAX_COUNT) {
            uiToast("Больше " + IMG_MAX_COUNT + " фото за раз нельзя.", "err"); resolve(); return;
          }
          const img = new Image();
          const rd = new FileReader();
          rd.onload = () => { img.onload = () => {
            const max = 1024, sc = Math.min(1, max / Math.max(img.width, img.height));
            const cv = document.createElement("canvas");
            cv.width = Math.round(img.width * sc); cv.height = Math.round(img.height * sc);
            cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
            pendImgs.push(cv.toDataURL("image/jpeg", 0.85));
            pendPdf = null; pendPdfName = ""; $("filepdf").value = "";
            resolve();
          }; img.onerror = () => resolve(); img.src = rd.result; };
          rd.onerror = () => resolve();
          rd.readAsDataURL(file);
        });
        const addImages = async (files) => {
          for (const f of files) { if (f && f.type && f.type.startsWith("image/")) await addImage(f); }
          renderChipSlot();
        };
        $("file").addEventListener("change", () => addImages([...$("file").files]));

        // ── Ctrl+V: фото прямо из буфера обмена, не с диска ──
        $("text").addEventListener("paste", (e) => {
          const items = (e.clipboardData && e.clipboardData.items) || [];
          const imgs = [];
          for (const it of items) {
            if (it.kind === "file" && it.type.startsWith("image/")) {
              const f = it.getAsFile(); if (f) imgs.push(f);
            }
          }
          if (!imgs.length) return;        // обычный текст — не мешаем вставке
          e.preventDefault();
          if (!vision) { uiToast("Эта модель не умеет смотреть фото.", "err"); return; }
          addImages(imgs);
        });

        // ── PDF: читаем как есть, текст вытащит сервер ──
        const clearPdf = () => { pendPdf = null; pendPdfName = ""; $("filepdf").value = ""; renderChipSlot(); };
        $("filepdf").addEventListener("change", () => {
          const f = $("filepdf").files[0];
          if (!f) return;
          if (f.size > 8 * 1024 * 1024) { uiToast("PDF слишком большой (максимум 8 МБ).", "err"); $("filepdf").value = ""; return; }
          const rd = new FileReader();
          rd.onload = () => {
            pendPdf = rd.result; pendPdfName = f.name;
            pendImgs = []; $("file").value = "";
            renderChipSlot();
          };
          rd.readAsDataURL(f);
        });

        loadState();
      })();
      </script>
    </body>
    </html>
