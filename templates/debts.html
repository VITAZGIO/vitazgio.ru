<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>**TITLE** · vitazgio.ru</title>
  <style>
    :root{--bg:#08111f;--panel:#0c1628;--line:#1d3151;--text:#f4fbff;--muted:#8aa2c7;--cyan:#35e0f0;--green:#63f5ad;--pink:#ff4fb3;--yellow:#f6c04a;--u-cyan:var(--cyan);--u-green:var(--green);--u-pink:var(--pink);--u-yellow:var(--yellow);--u-violet:#9d7bff;--u-orange:#ff9a4d;}
    *{box-sizing:border-box} body{margin:0;min-height:100vh;background:radial-gradient(circle at 20% 0,#142947 0,#08111f 46%,#060b14 100%);color:var(--text);font:15px/1.45 "Segoe UI",Arial,sans-serif;}
    body::before{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(transparent 96%,rgba(53,224,240,.08) 97%);background-size:100% 4px;opacity:.45}
    a{color:inherit} button,input,select{font:inherit} .wrap{width:min(1480px,calc(100vw - 56px));margin:0 auto;padding:36px 0 54px;position:relative;z-index:1}
    .head{display:flex;align-items:center;gap:18px;margin-bottom:28px} .back{width:44px;height:44px;flex:none;border-radius:50%;border:1px solid rgba(53,224,240,.55);display:grid;place-items:center;text-decoration:none;color:var(--cyan);background:rgba(53,224,240,.08);transition:all .18s}
    .back:hover{color:#fff;border-color:var(--cyan);background:rgba(53,224,240,.2)} .back svg{width:20px;height:20px;display:block}
    h1{margin:0;font-size:clamp(34px,4vw,58px);line-height:1;font-weight:900;letter-spacing:0} h1 span{color:var(--cyan);text-shadow:0 0 22px rgba(53,224,240,.35)} .tag{margin-left:auto;color:var(--green);font-weight:800;text-transform:uppercase;letter-spacing:.08em;font-size:12px}
    .unlock{max-width:520px;border:1px solid var(--line);background:rgba(12,22,40,.82);padding:26px;margin-top:58px;box-shadow:inset 3px 0 0 var(--cyan)} .unlock h2,.panel h2{margin:0 0 10px;font-size:22px} .muted{color:var(--muted)} .hidden{display:none!important}
    .keypad{display:none}
    @media (max-width:640px){
      .keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:4px 0}
      .keypad button{border:1px solid #28405f;background:#071021;color:var(--text);padding:16px 0;font-size:22px;font-weight:800;cursor:pointer;border-radius:8px}
      .keypad button:active{background:rgba(53,224,240,.18);border-color:var(--cyan)}
      .keypad button[data-bksp]{font-size:18px;color:var(--muted)}
    }
    .panel{border:1px solid var(--line);background:rgba(12,22,40,.78);padding:20px;min-width:0} .panel.accent{box-shadow:inset 3px 0 0 var(--cyan)}
    .total{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:18px} .stat{border:1px solid var(--line);background:rgba(7,14,27,.82);padding:16px} .stat b{display:block;font-size:28px;color:var(--cyan)} .stat i{font-style:normal;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.08em}
    form{display:grid;gap:10px} label{display:grid;gap:6px;color:#b8c8e8;font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:.06em} input,select{width:100%;border:1px solid #28405f;background:#071021;color:var(--text);padding:11px 12px;outline:none} input:focus,select:focus{border-color:var(--cyan);box-shadow:0 0 0 2px rgba(53,224,240,.14)} .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .btn{border:1px solid rgba(53,224,240,.7);background:rgba(53,224,240,.16);color:var(--text);padding:11px 14px;font-weight:900;cursor:pointer} .btn:hover{background:rgba(53,224,240,.24)} .btn.danger{border-color:rgba(255,79,179,.55);background:rgba(255,79,179,.12)} .btn.small{padding:7px 9px;font-size:12px}
    /* Выбор человека — узкая полоска кружков-аватарок (первая буква имени),
       не список карточек на всю ширину: на телефоне для формы и истории
       остаётся куда больше места. Тап — выбрать, зажать — редактировать
       (цвет обводки/пароль/удаление) во всплывающей карточке. */
    .owner-shell{display:flex;gap:14px;align-items:flex-start}
    .rail{flex:0 0 72px;display:flex;flex-direction:column;align-items:center;gap:10px;border:1px solid var(--line);background:rgba(12,22,40,.78);padding:14px 8px;box-shadow:inset 3px 0 0 var(--cyan)}
    .avatar{width:48px;height:48px;flex:0 0 auto;border-radius:50%;border:3px solid var(--ac-user,var(--cyan));background:#081427;color:var(--text);font-size:18px;font-weight:900;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
    .avatar-label{display:block;line-height:1;transform:translateY(-.04em)}
    .avatar.active{box-shadow:0 0 0 3px rgba(255,255,255,.1),0 0 14px var(--ac-user,var(--cyan))}
    .avatar-add{border-style:dashed;color:var(--muted);font-size:24px;font-weight:400}
    .owner-main{flex:1;min-width:0;display:grid;gap:16px}
    .user-head{border:1px solid var(--line);background:rgba(12,22,40,.78);padding:16px 20px;box-shadow:inset 3px 0 0 var(--ac-user,var(--cyan))}
    .user-head .uh-name{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:800}
    .user-head .uh-total{font-size:32px;font-weight:900;color:var(--ac-user,var(--cyan));line-height:1.3}
    .user-head .uh-sub{font-size:12px}
    .no-user{border:1px dashed #294260;color:var(--muted);padding:36px;text-align:center}
    .modal-back{position:fixed;inset:0;background:rgba(4,8,16,.72);display:grid;place-items:center;padding:20px;z-index:50}
    .modal{width:min(380px,100%);border:1px solid var(--line);background:#0c1628;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
    .modal h3{margin:0 0 4px;font-size:18px} .modal .muted{margin:0 0 4px}
    .swatches{display:flex;gap:10px;margin:6px 0 4px}
    .swatch{width:30px;height:30px;border-radius:50%;border:3px solid transparent;cursor:pointer;padding:0}
    .swatch.active{border-color:#fff}
    .swatch.cyan{background:var(--u-cyan)} .swatch.green{background:var(--u-green)} .swatch.pink{background:var(--u-pink)} .swatch.yellow{background:var(--u-yellow)} .swatch.violet{background:var(--u-violet)} .swatch.orange{background:var(--u-orange)}
    .modal-actions{display:flex;gap:10px;margin-top:8px} .modal-actions .btn{flex:1}
    .entry-form{grid-template-columns:1.1fr .8fr .8fr 1.4fr auto;align-items:end;margin-bottom:18px} .history{width:100%;border-collapse:collapse} .history th,.history td{border-bottom:1px solid #1a2d49;padding:11px 8px;text-align:left;vertical-align:top} .history th{color:#86a1cc;font-size:12px;text-transform:uppercase;letter-spacing:.08em} .sum{font-weight:900;color:var(--cyan);white-space:nowrap} .sum.minus{color:var(--green)} .kind{font-style:normal;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em} .empty{padding:28px;border:1px dashed #294260;color:var(--muted);text-align:center}
    .del-x{border:1px solid rgba(255,79,179,.55);background:rgba(255,79,179,.12);color:var(--text);width:26px;height:26px;border-radius:50%;cursor:pointer;display:grid;place-items:center;padding:0}
    .del-x:hover{border-color:var(--pink);background:rgba(255,79,179,.24)} .del-x svg{width:12px;height:12px;display:block}
    .err{min-height:20px;color:#ff7aa9;font-weight:800} .ok{color:var(--green)} .debtor-card{max-width:960px;margin:auto} .debtor-card .history{margin-top:16px}
    @media (max-width:980px){
      .wrap{width:min(100vw - 24px,760px);padding-top:20px}.total{grid-template-columns:1fr}.entry-form{grid-template-columns:1fr}.tag{display:none}
      .rail{flex:0 0 60px;padding:10px 6px;gap:8px} .avatar{width:42px;height:42px;font-size:16px}
      /* Таблица истории на телефоне не влезает в ширину (дата, тип, сумма,
         комментарий, крестик — реально требуют больше 400px, да ещё и рядом
         теперь полоска аватарок) и раньше просто уезжала вбок вместе со
         всей страницей. Вместо строки — карточка: дата сверху слева,
         крестик — сверху справа (сбоку), тип+сумма — по центру строкой,
         комментарий — снизу отдельно. */
      .history thead{display:none}
      .history,.history tbody{display:block}
      .history tr{
        display:grid;grid-template-columns:1fr auto;
        grid-template-areas:"date act" "kind sum" "comment comment";
        gap:6px 12px;border:1px solid var(--line);background:rgba(7,14,27,.7);
        padding:14px;border-radius:10px;margin-bottom:10px;
      }
      .history td{border:none;padding:0;vertical-align:middle}
      .history td:nth-child(1){grid-area:date;color:var(--muted);font-size:12px;align-self:start}
      .history td:nth-child(2){grid-area:kind;align-self:center}
      .history td:nth-child(2) .kind{font-size:14px}
      .history td:nth-child(3){grid-area:sum;text-align:right;align-self:center;font-size:19px}
      .history td:nth-child(4){grid-area:comment;color:var(--muted);font-size:13px;padding-top:8px;border-top:1px solid #1a2d49;margin-top:2px}
      .history td:nth-child(5){grid-area:act;justify-self:end;align-self:start}
    }
  </style>
</head>
<body data-mode="**MODE**">
  <main class="wrap">
    <header class="head"><a class="back" href="**BACK_HREF**" aria-label="Назад">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M19 12H5m0 0 6-6m-6 6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </a><h1>**TITLE_FIRST** <span>**TITLE_REST**</span></h1><div class="tag">vitazgio.ru</div></header>

    <section class="unlock" id="unlock" **UNLOCK_HIDDEN**>
      <h2>Пароль</h2>
      <p class="muted">Вход в управление долгами закрыт отдельным паролем (цифры).</p>
      <form id="unlock-form">
        <input id="unlock-pass" type="password" inputmode="numeric" pattern="[0-9]*" autocomplete="off" maxlength="12" placeholder="Пароль">
        <div class="keypad" id="keypad" aria-hidden="true">
          <button type="button" data-d="1">1</button><button type="button" data-d="2">2</button><button type="button" data-d="3">3</button>
          <button type="button" data-d="4">4</button><button type="button" data-d="5">5</button><button type="button" data-d="6">6</button>
          <button type="button" data-d="7">7</button><button type="button" data-d="8">8</button><button type="button" data-d="9">9</button>
          <span></span><button type="button" data-d="0">0</button><button type="button" data-bksp aria-label="Стереть">⌫</button>
        </div>
        <button class="btn" type="submit">Открыть</button><div class="err" id="unlock-err"></div>
      </form>
    </section>

    <section id="owner-app" class="owner-shell **OWNER_APP_HIDDEN**">
      <aside class="rail">
        <div class="avatars" id="avatars"></div>
        <button class="avatar avatar-add" id="add-user-btn" type="button" title="Новый человек" aria-label="Новый человек">+</button>
      </aside>
      <section class="owner-main">
        <div class="user-head" id="user-head" hidden></div>
        <div class="no-user" id="no-user-msg" hidden>Нажми «+» слева, чтобы добавить человека.</div>
        <div class="panel" id="entry-panel" hidden>
          <h2>Добавить строку</h2>
          <form class="entry-form" id="entry-form">
            <label>Дата<input id="entry-date" type="date"></label>
            <label>Тип<select id="entry-kind"><option value="debt">Долг</option><option value="return">Вернул</option></select></label>
            <label>Сумма<input id="entry-amount" inputmode="decimal" placeholder="450"></label>
            <label>Комментарий<input id="entry-comment" maxlength="220" placeholder="если пусто — прочерк"></label>
            <button class="btn" type="submit">Записать</button>
          </form>
          <div class="err" id="entry-err"></div>
          <div id="history"></div>
        </div>
      </section>
    </section>

    <section id="debtor-app" class="panel accent debtor-card **DEBTOR_APP_HIDDEN**">
      <div class="total">
        <div class="stat"><i>к оплате</i><b id="me-total">0</b></div>
        <div class="stat"><i>записей</i><b id="me-count">0</b></div>
        <div class="stat"><i>режим</i><b>просмотр</b></div>
      </div>
      <h2 id="me-name">История</h2>
      <div id="me-history"></div>
    </section>
  </main>
  <script>
  (() => {
    "use strict";
    const mode = document.body.dataset.mode;
    const $ = id => document.getElementById(id);
    const esc = s => String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
    const money = cents => {
      const sign = cents < 0 ? "-" : "";
      const value = Math.abs(cents || 0) / 100;
      return sign + value.toLocaleString("ru-RU", {minimumFractionDigits: 0, maximumFractionDigits: 2}) + " ₽";
    };
    let data = {users:[],entries:[],total_cents:0,today:""};
    let selected = null;
    const PALETTE = ["cyan","green","pink","yellow","violet","orange"];

    async function api(path, opts={}) {
      const response = await fetch(path, {
        credentials: "same-origin",
        headers: {"Content-Type":"application/json"},
        ...opts
      });
      const result = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(result.error || "Ошибка сервера.");
      return result;
    }

    function rowHtml(entry, canDelete) {
      const cls = entry.kind === "return" ? "sum minus" : "sum";
      const label = entry.kind === "return" ? "вернул" : "долг";
      // "Кто" тут не нужен отдельной колонкой — историю смотрят уже
      // выбрав человека кружком-аватаркой, его имя и так на виду сверху.
      const deleteIcon = `<svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M4 4l8 8m0-8-8 8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>`;
      return `<tr><td>${esc(entry.date)}</td><td><i class="kind">${label}</i></td><td class="${cls}">${money(entry.kind === "return" ? -entry.amount_cents : entry.amount_cents)}</td><td>${esc(entry.comment || "—")}</td><td>${canDelete ? `<button class="del-x" data-del="${esc(entry.id)}" aria-label="Удалить" title="Удалить">${deleteIcon}</button>` : ""}</td></tr>`;
    }

    function tableHtml(entries, canDelete) {
      if (!entries.length) return `<div class="empty">Пока нет записей.</div>`;
      return `<table class="history"><thead><tr><th>Дата</th><th>Тип</th><th>Сумма</th><th>Комментарий</th><th></th></tr></thead><tbody>${entries.map(e => rowHtml(e, canDelete)).join("")}</tbody></table>`;
    }

    // ---- Свои карточки поверх страницы (вместо confirm()/prompt()) --------
    function closeModal() { $("modal-back")?.remove(); }

    function openModal(html) {
      closeModal();
      const back = document.createElement("div");
      back.className = "modal-back";
      back.id = "modal-back";
      back.innerHTML = `<div class="modal">${html}</div>`;
      back.addEventListener("click", e => { if (e.target === back) closeModal(); });
      document.body.appendChild(back);
      return back;
    }

    function swatchesHtml(idPrefix, activeColor) {
      return `<div class="swatches" id="${idPrefix}-swatches">${PALETTE.map(c =>
        `<button type="button" class="swatch ${c} ${c === activeColor ? "active" : ""}" data-color="${c}" aria-label="${c}"></button>`
      ).join("")}</div>`;
    }

    function bindSwatches(idPrefix, onPick) {
      $(`${idPrefix}-swatches`).addEventListener("click", e => {
        const sw = e.target.closest("[data-color]");
        if (!sw) return;
        onPick(sw.dataset.color);
        $(`${idPrefix}-swatches`).querySelectorAll(".swatch").forEach(s => s.classList.toggle("active", s === sw));
      });
    }

    // Подтверждение удаления — обязательно паролем долгов, чтобы случайный
    // тычок не в тот пункт списка не сносил запись без второго шага.
    function confirmDelete(title, run) {
      openModal(`
        <h3>${esc(title)}</h3>
        <p class="muted">Подтверди паролем долгов.</p>
        <input id="confirm-pass" type="password" inputmode="numeric" pattern="[0-9]*" autocomplete="off" placeholder="Пароль">
        <div class="err" id="confirm-err"></div>
        <div class="modal-actions">
          <button class="btn danger" type="button" id="confirm-ok">Удалить</button>
          <button class="btn" type="button" id="confirm-cancel">Отмена</button>
        </div>
      `);
      const input = $("confirm-pass");
      input.addEventListener("input", () => { input.value = input.value.replace(/\D/g, ""); });
      input.focus();
      $("confirm-cancel").addEventListener("click", closeModal);
      const submit = async () => {
        $("confirm-err").textContent = "";
        try {
          await run(input.value);
          closeModal();
        } catch (err) { $("confirm-err").textContent = err.message; }
      };
      $("confirm-ok").addEventListener("click", submit);
      input.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); submit(); } });
    }

    function openCreateUser() {
      openModal(`
        <h3>Новый человек</h3>
        <label>Имя<input id="new-name" maxlength="60" autocomplete="off"></label>
        <label>Пароль для входа<input id="new-pass" autocomplete="new-password"></label>
        ${swatchesHtml("new", PALETTE[0])}
        <div class="err" id="new-err"></div>
        <div class="modal-actions">
          <button class="btn" type="button" id="new-create">Создать</button>
          <button class="btn" type="button" id="new-cancel">Отмена</button>
        </div>
      `);
      let color = PALETTE[0];
      bindSwatches("new", c => { color = c; });
      $("new-cancel").addEventListener("click", closeModal);
      $("new-create").addEventListener("click", async () => {
        $("new-err").textContent = "";
        try {
          data = await api("/api/debts/users", {method:"POST", body:JSON.stringify({name:$("new-name").value, password:$("new-pass").value, color})});
          selected = data.selected_id || selected;
          closeModal();
          renderOwner();
        } catch (err) { $("new-err").textContent = err.message; }
      });
    }

    function openEditUser(user) {
      openModal(`
        <h3>${esc(user.name)}</h3>
        <label>Пароль для входа<input id="edit-pass" autocomplete="off" value="${esc(user.password || "")}" placeholder="старый скрыт — задай новый"></label>
        ${swatchesHtml("edit", user.color || "cyan")}
        <div class="err" id="edit-err"></div>
        <div class="modal-actions">
          <button class="btn" type="button" id="edit-save">Сохранить</button>
          <button class="btn" type="button" id="edit-cancel">Отмена</button>
        </div>
        <div class="modal-actions">
          <button class="btn danger" type="button" id="edit-delete">Удалить человека</button>
        </div>
      `);
      let color = user.color || "cyan";
      bindSwatches("edit", c => { color = c; });
      $("edit-cancel").addEventListener("click", closeModal);
      $("edit-save").addEventListener("click", async () => {
        $("edit-err").textContent = "";
        try {
          const passVal = $("edit-pass").value.trim();
          if (passVal && passVal !== user.password) {
            data = await api("/api/debts/users/" + encodeURIComponent(user.id) + "/password", {method:"POST", body:JSON.stringify({password:passVal})});
          }
          if (color !== (user.color || "cyan")) {
            data = await api("/api/debts/users/" + encodeURIComponent(user.id) + "/color", {method:"POST", body:JSON.stringify({color})});
          }
          closeModal();
          renderOwner();
        } catch (err) { $("edit-err").textContent = err.message; }
      });
      $("edit-delete").addEventListener("click", () => {
        confirmDelete(`Удалить «${user.name}» и всю его историю?`, async password => {
          data = await api("/api/debts/users/" + encodeURIComponent(user.id), {method:"DELETE", body:JSON.stringify({password})});
          if (selected === user.id) selected = null;
          renderOwner();
        });
      });
    }

    // Тап по кружку — выбрать человека. Зажать (~550мс) — открыть
    // редактирование (цвет, пароль, удаление). Pointer Events — единый
    // путь для мыши и тача, чтобы не дублировать обработчики.
    function bindAvatarPress(btn, userId) {
      let timer = null, longFired = false;
      const start = () => {
        longFired = false;
        timer = setTimeout(() => {
          longFired = true;
          const user = data.users.find(u => u.id === userId);
          if (user) openEditUser(user);
        }, 550);
      };
      const cancel = () => clearTimeout(timer);
      const end = () => {
        clearTimeout(timer);
        if (!longFired) { selected = userId; renderOwner(); }
      };
      btn.addEventListener("pointerdown", start);
      btn.addEventListener("pointerup", end);
      btn.addEventListener("pointerleave", cancel);
      btn.addEventListener("pointercancel", cancel);
      btn.addEventListener("contextmenu", e => e.preventDefault());
    }

    function renderRail() {
      $("avatars").innerHTML = data.users.map(u => {
        const initial = (u.name || "?").trim().slice(0, 1).toUpperCase() || "?";
        return `<button type="button" class="avatar ${u.id === selected ? "active" : ""}" data-user="${esc(u.id)}"
          style="--ac-user:var(--u-${esc(u.color || "cyan")})" title="${esc(u.name)}" aria-label="${esc(u.name)}"><span class="avatar-label">${esc(initial)}</span></button>`;
      }).join("");
      $("avatars").querySelectorAll("[data-user]").forEach(btn => bindAvatarPress(btn, btn.dataset.user));
    }

    function renderOwner() {
      if (!selected && data.users.length) selected = data.users[0].id;
      if (selected && !data.users.some(u => u.id === selected)) selected = data.users[0]?.id || null;
      renderRail();
      const active = data.users.find(u => u.id === selected);
      const head = $("user-head");
      const entryPanel = $("entry-panel");
      const noUser = $("no-user-msg");
      if (active) {
        head.hidden = false;
        head.style.setProperty("--ac-user", `var(--u-${active.color || "cyan"})`);
        head.innerHTML = `<div class="uh-name">${esc(active.name)}</div><div class="uh-total">${money(active.total_cents)}</div><div class="uh-sub muted">${active.entry_count} записей</div>`;
        entryPanel.hidden = false;
        noUser.hidden = true;
        $("entry-date").value = data.today || new Date().toISOString().slice(0,10);
        const shown = data.entries.filter(e => e.user_id === selected);
        $("history").innerHTML = tableHtml(shown, true);
      } else {
        head.hidden = true;
        entryPanel.hidden = true;
        noUser.hidden = false;
      }
    }

    async function loadOwner() {
      data = await api("/api/debts");
      renderOwner();
    }

    async function loadDebtor() {
      const me = await api("/api/debts/me");
      $("me-total").textContent = money(me.me.total_cents);
      $("me-count").textContent = String(me.entries.length);
      $("me-name").textContent = me.me.name;
      $("me-history").innerHTML = tableHtml(me.entries, false);
    }

    if (mode === "owner") {
      const passInput = $("unlock-pass");
      const isPhone = () => window.matchMedia("(max-width:640px)").matches;
      // На телефоне пароль вводится только своей клавиатурой из цифр —
      // родная клавиатура не нужна, readonly её не даёт вызвать.
      const syncReadonly = () => { if (passInput) passInput.readOnly = isPhone(); };
      syncReadonly();
      window.addEventListener("resize", syncReadonly);
      passInput?.addEventListener("input", () => {
        passInput.value = passInput.value.replace(/\D/g, "");
      });
      $("keypad")?.addEventListener("click", e => {
        const digit = e.target.closest("button[data-d]");
        if (digit) {
          if (passInput.value.length < 12) passInput.value += digit.dataset.d;
        } else if (e.target.closest("button[data-bksp]")) {
          passInput.value = passInput.value.slice(0, -1);
        } else {
          return;
        }
        passInput.focus();
      });

      $("unlock-form")?.addEventListener("submit", async e => {
        e.preventDefault();
        $("unlock-err").textContent = "";
        try {
          await api("/api/debts/unlock", {method:"POST", body:JSON.stringify({password:$("unlock-pass").value})});
          $("unlock").classList.add("hidden");
          $("owner-app").classList.remove("hidden");
          await loadOwner();
        } catch (err) {
          $("unlock-err").textContent = err.message;
        }
      });
      $("add-user-btn").addEventListener("click", openCreateUser);
      $("entry-form").addEventListener("submit", async e => {
        e.preventDefault();
        $("entry-err").textContent = "";
        try {
          data = await api("/api/debts/entries", {method:"POST", body:JSON.stringify({user_id:selected, date:$("entry-date").value, kind:$("entry-kind").value, amount:$("entry-amount").value, comment:$("entry-comment").value})});
          $("entry-amount").value = ""; $("entry-comment").value = ""; $("entry-kind").value = "debt";
          renderOwner();
        } catch (err) { $("entry-err").textContent = err.message; }
      });
      $("history").addEventListener("click", e => {
        const btn = e.target.closest("[data-del]");
        if (!btn) return;
        const id = btn.dataset.del;
        confirmDelete("Удалить запись?", async password => {
          data = await api("/api/debts/entries/" + encodeURIComponent(id), {method:"DELETE", body:JSON.stringify({password})});
          renderOwner();
        });
      });
      if (!$("owner-app").classList.contains("hidden")) loadOwner().catch(err => $("entry-err").textContent = err.message);
    } else {
      loadDebtor().catch(err => $("me-history").innerHTML = `<div class="empty">${esc(err.message)}</div>`);
    }
  })();
  </script>
</body>
</html>
