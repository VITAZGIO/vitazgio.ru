    <!DOCTYPE html>
    <html lang="ru">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <meta name="robots" content="noindex, nofollow">
      <title>Экран телефона · vitazgio.ru</title>
      __ICONLINKS__
      <style>
        /* Акцент один на всю страницу и живёт переменной: цвета кнопок и
           рамок считаются от него через color-mix, а не прописаны числами —
           как и везде на сайте. */
        :root { --ac: #69e8ff; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100svh; color: #e9fbff; font-family: "Cascadia Code", Consolas, monospace;
               background: radial-gradient(circle at top left, #16283f, #0d1321 55%); }
        [hidden] { display: none !important; }
        a { color: inherit; }
        .wrap { max-width: 1320px; margin: 0 auto; padding: clamp(18px, 3vw, 40px); }
        .head { display: flex; align-items: center; gap: 18px; margin-bottom: 20px; }
        .back { width: 44px; height: 44px; flex: none; display: grid; place-items: center;
                color: var(--ac); text-decoration: none; border-radius: 50%;
                border: 1px solid color-mix(in srgb, var(--ac) 35%, transparent);
                background: color-mix(in srgb, var(--ac) 8%, transparent); transition: all .18s; }
        .back:hover { color: #fff; background: color-mix(in srgb, var(--ac) 20%, transparent); }
        .back svg { width: 20px; height: 20px; display: block; }
        h1 { margin: 0; font-size: clamp(1.5rem, 3.4vw, 2.1rem); letter-spacing: -.02em; }
        .sub { margin: 3px 0 0; color: #8b93a6; font-size: .82rem; }

        .stage { position: relative; display: grid; place-items: center; min-height: 46svh;
                 border: 1px solid color-mix(in srgb, var(--ac) 22%, transparent);
                 background: #070b14; overflow: hidden; }
        /* Холст держит свои пропорции сам: телефон вертикальный, и
           растягивать его на всю ширину было бы нечестно к картинке. */
        canvas { max-width: 100%; max-height: 78svh; display: block; }
        .idle { padding: 40px 20px; color: #8b93a6; font-size: .84rem; text-align: center; line-height: 1.7; }

        .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 14px; }
        .btn { padding: 9px 14px; color: var(--ac); font: 700 .74rem "Cascadia Code", Consolas, monospace;
               text-transform: uppercase; letter-spacing: .04em; cursor: pointer;
               border: 1px solid color-mix(in srgb, var(--ac) 35%, transparent);
               background: color-mix(in srgb, var(--ac) 7%, transparent); }
        .btn:hover:not([disabled]) { color: #fff; background: color-mix(in srgb, var(--ac) 22%, transparent); }
        .btn[disabled] { color: #4a5060; cursor: not-allowed;
                         border-color: rgba(100,100,110,.2); background: rgba(60,65,75,.06); }
        .tick { display: flex; align-items: center; gap: 6px; color: #8b93a6; font-size: .76rem;
                text-transform: uppercase; letter-spacing: .04em; cursor: pointer; }
        .tick input { accent-color: var(--ac); width: 15px; height: 15px; }
        .vol { width: 110px; accent-color: var(--ac); }
        .vol[disabled] { opacity: .35; }
        /* Пока управление включено, курсор над картинкой — прицел, а не
           стрелка: видно, что клик уйдёт в телефон. Свой маленький крестик
           картинкой, не системный cursor:crosshair — тот на многих
           системах рисуется огромным на весь экран. */
        canvas.ruling {
          cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18"><path d="M9 1.5v5M9 11.5v5M1.5 9h5M11.5 9h5" stroke="%2369e8ff" stroke-width="1.6" stroke-linecap="round"/></svg>') 9 9, crosshair;
        }

        /* Во весь экран (кнопка "Во весь экран" на /phone, requestFullscreen
           у #stage целиком, не только у canvas — иначе оверлейные кнопки
           поверх картинки показать было бы нечем: Fullscreen API рисует
           только то, что лежит ВНУТРИ элемента, ушедшего в fullscreen). */
        .stage.is-full { background: #000; border: none; }
        .stage.is-full canvas { max-width: 100vw; max-height: 100svh; width: auto; height: 100svh; }
        /* Колонка "Назад/Домой/Недавние" — замена нижней панели кнопок,
           которая в fullscreen не видна (она вне #stage). Показываем только
           на узких/тач-экранах: на ПК из fullscreen выходят по Esc и жмут
           обычную панель под картинкой. */
        .nav-col { display: none; position: absolute; right: 0; top: 50%; z-index: 6;
                   transform: translateY(-50%); flex-direction: column;
                   background: color-mix(in srgb, #0d1321 82%, transparent);
                   border-radius: 22px 0 0 22px; overflow: hidden;
                   box-shadow: -6px 0 20px rgba(0,0,0,.5); }
        .stage.is-full-mobile .nav-col:not([hidden]) { display: flex; }
        .nav-col button { width: 50px; height: 50px; display: grid; place-items: center;
                          color: #dfe8ff; font-size: 1.2rem; border: none; padding: 0;
                          background: transparent; border-bottom: 1px solid rgba(255,255,255,.1); }
        .nav-col button:last-child { border-bottom: none; }
        .nav-col button:active { background: color-mix(in srgb, var(--ac) 28%, transparent); }
        .state { margin-left: auto; color: #8b93a6; font-size: .78rem; }
        .state b { color: #63f5ad; font-weight: 700; }
        .state b.off { color: #ff6b81; }

        .ui-toasts { position: fixed; z-index: 70; left: 50%; bottom: 22px; transform: translateX(-50%);
                     display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; }
        .ui-toast { padding: 10px 15px; color: #eef2fb; font-size: .78rem; max-width: min(420px, 86vw); text-align: center;
                    border: 1px solid rgba(255,255,255,.12); background: #10162a;
                    box-shadow: 0 10px 30px rgba(0,0,0,.45); transition: opacity .25s; }
        .ui-toast.err { color: #ffb3b3; border-color: rgba(255,107,129,.4); }
        .ui-toast.ok { border-color: rgba(99,245,173,.4); }

        .ui-scrim { position: fixed; inset: 0; z-index: 60; display: flex; align-items: center; justify-content: center;
                    padding: 20px; background: rgba(3,6,13,.82); backdrop-filter: blur(10px); }
        .ui-modal { width: min(380px, 100%); padding: 22px; color: #eef2fb;
                    border: 1px solid color-mix(in srgb, var(--ac) 30%, transparent);
                    background: linear-gradient(145deg, rgba(16,30,47,.98), rgba(20,16,37,.98));
                    box-shadow: 0 32px 100px rgba(0,0,0,.65); }
        .ui-modal h2 { margin: 0 0 14px; font-size: 1.05rem; }
        .ui-modal p { margin: 0 0 14px; font-size: .82rem; line-height: 1.55; color: #dbe2f5; }
        .ui-modal input { width: 100%; height: 42px; padding: 0 12px; margin: 0 0 12px; color: #f4fbff;
                          border: 1px solid rgba(255,255,255,.14); background: rgba(8,12,22,.85);
                          font-family: inherit; }
        .ui-modal input:focus { border-color: var(--ac); outline: none; }
        .ui-err { margin: 0; color: #ffb3b3; font-size: .78rem; min-height: 1.1em; }
      </style>
    </head>
    <body>
      <div class="wrap">
        <header class="head">
          <a class="back" href="/netbird" aria-label="Назад">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M15 5l-7 7 7 7" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </a>
          <div>
            <h1>Экран телефона</h1>
            <p class="sub">MOBILA · картинка идёт тем же соединением, что и агент</p>
          </div>
        </header>

        <div class="stage" id="stage">
          <canvas id="screen" hidden></canvas>
          <p class="idle" id="idle">Картинки пока нет.<br>Нажми «Показать экран» и подтверди запрос на телефоне.</p>
          <!-- Во весь экран на телефоне снизу панель с "Назад/Домой/Недавние"
               не видна (она вне .stage, а Fullscreen API показывает только
               содержимое самого fullscreen-элемента) — эта колонка её
               подменяет, пока и управление включено, и мы в полноэкранном
               режиме на узком экране (см. setRuling/fullscreenchange). -->
          <div class="nav-col" id="navCol" hidden>
            <button type="button" data-key="back" aria-label="Назад">←</button>
            <button type="button" data-key="home" aria-label="Домой">⌂</button>
            <button type="button" data-key="recents" aria-label="Недавние">▤</button>
          </div>
        </div>

        <div class="bar">
          <button class="btn" id="go" type="button">Показать экран</button>
          <button class="btn" id="halt" type="button" disabled>Остановить</button>
          <button class="btn" id="full" type="button" disabled>Во весь экран</button>
          <label class="tick"><input type="checkbox" id="rule"> управление</label>
          <label class="tick"><input type="checkbox" id="sound"> звук</label>
          <input class="vol" id="vol" type="range" min="0" max="100" value="70" disabled
                 aria-label="Громкость">
          <span class="state">телефон: <b id="agent-state" class="off">нет связи</b> · <span id="fps">—</span>
            <span id="diag" style="opacity:.6"></span></span>
        </div>

        <!-- Кнопки телефона — не жесты: тыкать в их места на экране было бы
             гаданием, у разных оболочек они в разных местах. -->
        <div class="bar" id="keys" hidden>
          <button class="btn" type="button" data-key="back">← Назад</button>
          <button class="btn" type="button" data-key="home">⌂ Домой</button>
          <button class="btn" type="button" data-key="recents">▤ Недавние</button>
          <span class="state">клавиатура печатает в поле, выбранное на телефоне</span>
        </div>
      </div>

      <script>
      (() => {
        const consoleOk = "{{CONSOLE_OK}}" === "1";

        const uiToasts = document.createElement("div");
        uiToasts.className = "ui-toasts";
        document.body.appendChild(uiToasts);
        const uiToast = (text, kind) => {
          const t = document.createElement("div");
          t.className = "ui-toast" + (kind ? " " + kind : "");
          t.textContent = text;
          uiToasts.appendChild(t);
          setTimeout(() => { t.style.opacity = "0"; setTimeout(() => t.remove(), 260); }, 2600);
        };

        /* Суточный пароль консоли — своей карточкой, не системным prompt(),
           как и на /netbird. Правило хозяина «гости не управляют
           устройствами» действует и на экран телефона. */
        const askConsole = () => new Promise((resolve) => {
          const scrim = document.createElement("div");
          scrim.className = "ui-scrim";
          scrim.innerHTML = '<div class="ui-modal"><h2>Пароль консоли</h2>'
            + '<p>Экран телефона закрыт тем же суточным паролем, что и консоль.</p>'
            + '<input type="password" autocomplete="off"><p class="ui-err"></p>'
            + '<button class="btn" type="button">Войти</button></div>';
          document.body.appendChild(scrim);
          const input = scrim.querySelector("input");
          const err = scrim.querySelector(".ui-err");
          const send = async () => {
            err.textContent = "";
            try {
              const response = await fetch("/api/console/login", {
                method: "POST", credentials: "same-origin",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ password: input.value }),
              });
              if (!response.ok) {
                const data = await response.json().catch(() => ({}));
                err.textContent = data.error || "Не вышло войти.";
                return;
              }
            } catch {
              err.textContent = "Сервер не ответил.";
              return;
            }
            scrim.remove();
            resolve(true);
          };
          scrim.querySelector("button").addEventListener("click", send);
          input.addEventListener("keydown", (event) => { if (event.key === "Enter") send(); });
          requestAnimationFrame(() => input.focus());
        });

        const stageEl = document.getElementById("stage");
        const canvas = document.getElementById("screen");
        const idle = document.getElementById("idle");
        const navCol = document.getElementById("navCol");
        const goBtn = document.getElementById("go");
        const haltBtn = document.getElementById("halt");
        const fullBtn = document.getElementById("full");
        const agentState = document.getElementById("agent-state");
        const fpsBox = document.getElementById("fps");
        const diagBox = document.getElementById("diag");
        // Временная диагностика (2026-09-16): что реально доходит от
        // телефона, до любых попыток декодировать — если картинки нет, это
        // говорит сразу, где искать: у cfg=0 виноват телефон или сеть, у
        // cfg>0 без кадров — сам декодер/SPS. Снять после починки.
        const diag = { cfg: 0, key: 0, delta: 0, other: 0, decodeErr: 0 };
        const showDiag = () => {
          diagBox.textContent = ` · cfg ${diag.cfg} key ${diag.key} delta ${diag.delta}`
            + (diag.other ? ` other ${diag.other}` : "")
            + (diag.decodeErr ? ` ошибок-декода ${diag.decodeErr}` : "");
        };
        const paint = canvas.getContext("2d");

        let socket = null;
        let decoder = null;
        // SPS/PPS сами по себе — не кадр, decode() их отдельно не проглотит
        // (ровно это и роняло декодер — см. историю правки 2026-09-16):
        // приклеиваем к байтам первого настоящего опорного кадра и скармливаем
        // одним куском, как Annex-B и ждёт.
        let pendingSps = null;
        let frames = 0;
        let lastCount = performance.now();

        /* Строку кодека берём из самих SPS, а не из слов телефона: в
           параметрах лежат профиль, ограничения и уровень ровно теми
           байтами, которых ждёт WebCodecs (avc1.PPCCLL). */
        const codecFromConfig = (bytes) => {
          for (let i = 0; i + 4 < bytes.length; i++) {
            const start3 = bytes[i] === 0 && bytes[i + 1] === 0 && bytes[i + 2] === 1;
            const start4 = bytes[i] === 0 && bytes[i + 1] === 0 && bytes[i + 2] === 0 && bytes[i + 3] === 1;
            if (!start3 && !start4) continue;
            const head = i + (start4 ? 4 : 3);
            if ((bytes[head] & 0x1f) !== 7) continue;       // не SPS
            const hex = [bytes[head + 1], bytes[head + 2], bytes[head + 3]]
              .map((b) => b.toString(16).padStart(2, "0")).join("");
            return "avc1." + hex;
          }
          return "avc1.42E01E";                             // разумный запасной
        };

        const drawFrame = (frame) => {
          if (canvas.width !== frame.displayWidth || canvas.height !== frame.displayHeight) {
            canvas.width = frame.displayWidth;
            canvas.height = frame.displayHeight;
          }
          paint.drawImage(frame, 0, 0);
          frame.close();
          canvas.hidden = false;
          idle.hidden = true;
          fullBtn.disabled = false;
          frames += 1;
        };

        const startDecoder = (config) => {
          stopDecoder();
          if (!("VideoDecoder" in window)) {
            uiToast("Браузер не умеет WebCodecs — картинку показать нечем.", "err");
            return;
          }
          decoder = new VideoDecoder({
            output: drawFrame,
            error: (e) => {
              diag.decodeErr += 1; showDiag();
              console.log("[vg-phone] VideoDecoder error:", e && e.message);
              uiToast("Декодер споткнулся: " + e.message, "err");
              stopDecoder();
              ask("key");
            },
          });
          // description не передаём намеренно: телефон шлёт Annex-B (как его
          // отдаёт MediaCodec), а WebCodecs ждёт AVCC ровно тогда, когда
          // description задан. optimizeForLatency — ради того, чтобы кадр
          // показывался сразу, а не копился в буфере.
          decoder.configure({
            codec: codecFromConfig(config),
            optimizeForLatency: true,
          });
          // Сам config decode() не зовём: SPS/PPS без единого куска картинки —
          // не валидный кадр, декодер на нём падает (был баг — decodeErr рос
          // ровно один раз и дальше декодер молча стоял мёртвым). Ждём
          // первый настоящий опорный кадр в onBinary и клеим байты к нему.
          pendingSps = config;
        };

        const stopDecoder = () => {
          if (!decoder) return;
          try { decoder.close(); } catch {}
          decoder = null;
        };

        const showIdle = () => {
          stopDecoder();
          canvas.hidden = true;
          idle.hidden = false;
          fullBtn.disabled = true;
        };

        const ask = (type) => {
          if (!socket || socket.readyState !== WebSocket.OPEN) return;
          if (type === "audio-on" || type === "audio-off") {
            socket.send(JSON.stringify({ type: "audio", on: type === "audio-on" }));
            return;
          }
          socket.send(JSON.stringify({ type }));
        };

        const onBinary = (buffer) => {
          const bytes = new Uint8Array(buffer);
          if (bytes.length < 9) return;
          const kind = bytes[0];
          const view = new DataView(buffer);
          // Метка времени — микросекунды с начала трансляции, 8 байт
          // big-endian. Читаем как два числа по 32 бита: в кадрах WebCodecs
          // ждёт обычное число, а не BigInt.
          const stamp = view.getUint32(1) * 4294967296 + view.getUint32(5);
          const payload = bytes.subarray(9);
          if (kind === 1) {
            diag.cfg += 1; showDiag();
            console.log("[vg-phone] config-кадр, " + payload.length + " байт:",
              Array.from(payload.subarray(0, 24)).map((b) => b.toString(16).padStart(2, "0")).join(" "));
            startDecoder(payload);
            return;
          }
          if (kind === 2) { diag.key += 1; showDiag(); }
          else if (kind === 3) { diag.delta += 1; showDiag(); }
          else if (kind !== 5 && kind !== 6) { diag.other += 1; showDiag(); }
          if (kind === 5) {
            startAudio(payload);
            return;
          }
          if (kind === 6) {
            if (!audioDec || audioDec.state !== "configured" || !audioOn()) return;
            try {
              audioDec.decode(new EncodedAudioChunk({
                type: "key", timestamp: stamp, data: payload,
              }));
            } catch {
              stopAudioDecoder();
            }
            return;
          }
          if (!decoder || decoder.state !== "configured") return;
          let data = payload;
          if (kind === 2 && pendingSps) {
            // Первый опорный после свежего config — единственное место,
            // где SPS/PPS вообще можно скормить декодеру: приклеиваем
            // байты перед картинкой одним Annex-B куском.
            data = new Uint8Array(pendingSps.length + payload.length);
            data.set(pendingSps, 0);
            data.set(payload, pendingSps.length);
            pendingSps = null;
          }
          try {
            decoder.decode(new EncodedVideoChunk({
              type: kind === 2 ? "key" : "delta",
              timestamp: stamp,
              data,
            }));
          } catch (e) {
            // Разностный кадр без опорного — не беда: просим опорный и ждём.
            diag.decodeErr += 1; showDiag();
            console.log("[vg-phone] decode() бросил:", e && e.message);
            stopDecoder();
            ask("key");
          }
        };

        const onState = (data) => {
          const alive = Boolean(data.agent);
          agentState.textContent = alive ? "на связи" : "нет связи";
          agentState.classList.toggle("off", !alive);
          goBtn.disabled = !alive || Boolean(data.running);
          haltBtn.disabled = !data.running;
          if (!data.running) { showIdle(); stopAudioDecoder(); }
          if (data.error) uiToast(data.error, "err");
        };

        const connect = () => {
          const scheme = location.protocol === "https:" ? "wss" : "ws";
          socket = new WebSocket(`${scheme}://${location.host}/ws/phone`);
          socket.binaryType = "arraybuffer";
          socket.addEventListener("message", (event) => {
            if (typeof event.data !== "string") { onBinary(event.data); return; }
            let data;
            try { data = JSON.parse(event.data); } catch { return; }
            if (data.type === "state") onState(data);
            else if (data.type === "audio") {
              if (data.error) uiToast(data.error, "err");
              if (!data.running) stopAudioDecoder();
            }
            else if (data.type === "touch-reply" && !data.ok) uiToast(data.error || "Нажатие не прошло.", "err");
            else if (data.type === "asked" && !data.ok) uiToast(data.error || "Телефон не ответил.", "err");
            else if (data.type === "asked") uiToast("Жду подтверждения на телефоне…");
          });
          socket.addEventListener("close", () => {
            agentState.textContent = "нет связи";
            agentState.classList.add("off");
            goBtn.disabled = true;
            haltBtn.disabled = true;
            showIdle();
            // Сайт мог перезапуститься деплоем — возвращаемся сами, а не
            // просим человека перезагрузить вкладку.
            setTimeout(connect, 2000);
          });
        };

        /* ---- Звук (ступень 6) -----------------------------------------------
           Отдельным типом сообщений и со своей меткой времени: мешать звук
           с видеокадрами в один поток незачем. По умолчанию выключен —
           внезапно заоравший динамик на ПК так себе сюрприз. Рассинхрон
           лечится сдвигом звука (audioShift), а не перекодированием видео.

           Захватывается только звук приложений, которые не пометили себя как
           «не записывать»: у ютуба и музыкальных сервисов звука не будет, и
           это ограничение самого Android, а не поломка. */
        const soundBox = document.getElementById("sound");
        const volBox = document.getElementById("vol");
        let audioCtx = null;
        let audioGain = null;
        let audioDec = null;
        let audioAt = 0;          // когда играть следующий кусок
        const audioShift = 0.12;  // запас: без него куски рвутся на дрожании сети

        const audioOn = () => Boolean(audioCtx) && soundBox.checked;

        const startAudio = (config) => {
          if (!soundBox.checked) return;
          if (!("AudioDecoder" in window)) {
            uiToast("Браузер не умеет WebCodecs для звука.", "err");
            return;
          }
          stopAudioDecoder();
          audioDec = new AudioDecoder({
            output: (data) => playChunk(data),
            error: () => stopAudioDecoder(),
          });
          // description для AAC обязателен и приходит от телефона первым
          // куском (AudioSpecificConfig) — без него декодер не заведётся.
          audioDec.configure({
            codec: "mp4a.40.2",
            sampleRate: 44100,
            numberOfChannels: 1,
            description: config,
          });
        };

        const stopAudioDecoder = () => {
          if (!audioDec) return;
          try { audioDec.close(); } catch {}
          audioDec = null;
          audioAt = 0;
        };

        const playChunk = (data) => {
          if (!audioCtx) { data.close(); return; }
          const frames = data.numberOfFrames;
          const buffer = audioCtx.createBuffer(1, frames, data.sampleRate);
          const plane = new Float32Array(frames);
          try {
            data.copyTo(plane, { planeIndex: 0, format: "f32-planar" });
          } catch {
            data.close();
            return;
          }
          data.close();
          buffer.copyToChannel(plane, 0);
          const source = audioCtx.createBufferSource();
          source.buffer = buffer;
          source.connect(audioGain);
          const now = audioCtx.currentTime;
          // Играем встык: следующий кусок ставим ровно за предыдущим, а
          // отставшие (сеть моргнула) подтягиваем к текущему времени.
          if (audioAt < now + audioShift) audioAt = now + audioShift;
          source.start(audioAt);
          audioAt += buffer.duration;
        };

        soundBox.addEventListener("change", async () => {
          volBox.disabled = !soundBox.checked;
          if (soundBox.checked) {
            // AudioContext заводится только по действию человека — таково
            // правило браузеров, и оно тут кстати.
            audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === "suspended") await audioCtx.resume();
            audioGain = audioGain || audioCtx.createGain();
            audioGain.connect(audioCtx.destination);
            audioGain.gain.value = volBox.value / 100;
            ask("audio-on");
          } else {
            stopAudioDecoder();
            ask("audio-off");
          }
        });

        volBox.addEventListener("input", () => {
          if (audioGain) audioGain.gain.value = volBox.value / 100;
        });

        /* ---- Управление пальцем (ступень 5) --------------------------------
           По умолчанию выключено намеренно: случайный клик по картинке не
           должен ничего нажимать на телефоне. Координаты уходят долями
           (0…1), а не пикселями — у ПК и телефона разные разрешения, а
           телефон ещё и поворачивается. */
        const ruleBox = document.getElementById("rule");
        const keysBar = document.getElementById("keys");
        let ruling = false;
        let press = null;

        // Телефон/тач-экран — свои: там нет клавиши Esc, чтобы просто выйти
        // из fullscreen и дотянуться до обычной панели под картинкой, ей на
        // замену и нужна колонка navCol. На ПК её незачем показывать —
        // выходят по Esc и жмут panel как обычно.
        const isMobileView = () => window.innerWidth <= 900 || navigator.maxTouchPoints > 0
          || /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

        const setRuling = (on) => {
          ruling = on;
          keysBar.hidden = !on;
          navCol.hidden = !(on && stageEl.classList.contains("is-full-mobile"));
          canvas.classList.toggle("ruling", on);
          // Иначе следующий же пробел или Enter активируют не телефон, а ТУ
          // же самую галочку/кнопку на сайте, за которой осталась фокусировка
          // клавиатуры (например, погасит управление, которое сам и включил).
          if (on && document.activeElement && document.activeElement.blur) {
            try { document.activeElement.blur(); } catch {}
          }
          uiToast(on ? "Управление включено" : "Управление выключено", on ? "ok" : "");
        };
        ruleBox.addEventListener("change", () => setRuling(ruleBox.checked));

        document.addEventListener("fullscreenchange", () => {
          const full = document.fullscreenElement === stageEl;
          stageEl.classList.toggle("is-full", full);
          stageEl.classList.toggle("is-full-mobile", full && isMobileView());
          navCol.hidden = !(ruling && stageEl.classList.contains("is-full-mobile"));
          if (full) fullBtn.textContent = "Свернуть";
          else fullBtn.textContent = "Во весь экран";
        });

        const spot = (event) => {
          const box = canvas.getBoundingClientRect();
          if (!box.width || !box.height) return null;
          return {
            x: Math.min(1, Math.max(0, (event.clientX - box.left) / box.width)),
            y: Math.min(1, Math.max(0, (event.clientY - box.top) / box.height)),
          };
        };

        const touch = (payload) => {
          if (socket && socket.readyState === WebSocket.OPEN) {
            socket.send(JSON.stringify({ type: "touch", ...payload }));
          }
        };

        canvas.addEventListener("pointerdown", (event) => {
          if (!ruling) return;
          const at = spot(event);
          if (!at) return;
          press = { ...at, at: performance.now(), movedAt: null };
          canvas.setPointerCapture(event.pointerId);
          event.preventDefault();
        });

        // Момент, когда палец реально сдвинулся с места (не дрогнул), а не
        // конечная точка при отпускании — по нему отличаем «зажать и вести»
        // (выделение текста, как на самом телефоне) от быстрого свайпа.
        canvas.addEventListener("pointermove", (event) => {
          if (!ruling || !press || press.movedAt) return;
          const at = spot(event);
          if (!at) return;
          if (Math.hypot(at.x - press.x, at.y - press.y) > 0.015) press.movedAt = performance.now();
        });

        canvas.addEventListener("pointerup", (event) => {
          if (!ruling || !press) return;
          const at = spot(event);
          const held = performance.now() - press.at;
          const moved = at ? Math.hypot(at.x - press.x, at.y - press.y) : 0;
          const heldBeforeMove = press.movedAt ? press.movedAt - press.at : held;
          // Что это было, решаем по следу: постояли на месте и ПОТОМ повели
          // пальцем в сторону — зажатие с протяжкой (выделение текста, как на
          // самом телефоне; TouchService.kt держит стоячий штрих на heldMs,
          // потом тем же «пальцем» без отрыва ведёт до конца). Увело сразу,
          // без паузы, — обычный свайп. Никуда не увело — долгое нажатие
          // или тычок.
          if (at && moved > 0.03 && heldBeforeMove > 420) {
            touch({ action: "select", x: press.x, y: press.y, x2: at.x, y2: at.y,
                    ms: Math.round(Math.min(1200, Math.max(420, heldBeforeMove))),
                    ms2: Math.round(Math.min(1200, Math.max(90, held - heldBeforeMove))) });
          } else if (at && moved > 0.03) {
            touch({ action: "swipe", x: press.x, y: press.y, x2: at.x, y2: at.y,
                    ms: Math.round(Math.min(600, Math.max(120, held))) });
          } else if (held > 500) {
            touch({ action: "long", x: press.x, y: press.y, ms: Math.round(held) });
          } else {
            touch({ action: "tap", x: press.x, y: press.y });
          }
          press = null;
          event.preventDefault();
        });

        canvas.addEventListener("pointercancel", () => { press = null; });

        // Колесо мыши — это свайп: листать страницу на телефоне иначе нечем.
        let wheelAt = 0;
        canvas.addEventListener("wheel", (event) => {
          if (!ruling) return;
          event.preventDefault();
          const now = performance.now();
          if (now - wheelAt < 260) return;          // не сыпать жестами подряд
          wheelAt = now;
          const at = spot(event) || { x: 0.5, y: 0.5 };
          const step = event.deltaY > 0 ? -0.28 : 0.28;
          touch({ action: "swipe", x: at.x, y: Math.min(0.9, Math.max(0.1, at.y)),
                  x2: at.x, y2: Math.min(0.95, Math.max(0.05, at.y + step)), ms: 180 });
        }, { passive: false });

        const keyClick = (event) => {
          const button = event.target.closest("[data-key]");
          if (!button) return;
          touch({ action: "key", name: button.dataset.key });
        };
        keysBar.addEventListener("click", keyClick);
        navCol.addEventListener("click", keyClick);

        document.addEventListener("keydown", (event) => {
          if (!ruling) return;
          if (event.target && /^(INPUT|TEXTAREA)$/.test(event.target.tagName)) return;
          if (event.key === "Escape") { touch({ action: "key", name: "back" }); return; }
          if (event.key === "Backspace") { touch({ action: "backspace" }); event.preventDefault(); return; }
          if (event.key === "Enter") { touch({ action: "text", text: "\n" }); event.preventDefault(); return; }
          // Печатаем только настоящие символы: сочетания с Ctrl/Alt — это
          // команды браузера, им на телефоне делать нечего.
          if (event.key.length === 1 && !event.ctrlKey && !event.altKey && !event.metaKey) {
            touch({ action: "text", text: event.key });
            // Без этого пробел на сфокусированной кнопке/галочке сайта (а не
            // на телефоне) браузер трактует как её нажатие — гасла та же
            // самая галочка «управление», которую сам и включил, посреди
            // набора текста. Enter выше — по той же причине.
            event.preventDefault();
          }
        });

        goBtn.addEventListener("click", () => {
          ask("start");
          uiToast("Подтверди захват на телефоне — Android спросит обязательно.");
        });
        haltBtn.addEventListener("click", () => ask("stop"));
        fullBtn.addEventListener("click", () => {
          if (document.fullscreenElement) { document.exitFullscreen().catch(() => {}); return; }
          if (stageEl.requestFullscreen) stageEl.requestFullscreen().catch(() => {});
        });

        setInterval(() => {
          const now = performance.now();
          const seconds = (now - lastCount) / 1000;
          fpsBox.textContent = frames ? `${Math.round(frames / seconds)} кадр/с` : "—";
          frames = 0;
          lastCount = now;
        }, 2000);

        (async () => {
          if (!consoleOk) await askConsole();
          connect();
        })();
      })();
      </script>
    </body>
    </html>
