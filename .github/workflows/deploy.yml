name: Deploy

on:
  push:
    branches:
      - main
  # Тот же деплой вызывается из автослияния веток claude/**. Своим ходом
  # это не сработало бы: push, сделанный самим Actions, новых запусков
  # намеренно не порождает — иначе можно было бы устроить бесконечный цикл.
  workflow_call:

jobs:
  # Второй заслон — уже перед самой сборкой на VPS. Нужен потому, что
  # деплой запускается и напрямую с push в main, минуя автослияние: без
  # этого прямой пуш уезжал бы в прод вообще без проверки. На пути через
  # claude/** тесты в итоге проходят дважды — это минута бесплатного
  # облачного раннера за то, что ни одна из двух дорог не остаётся дырой.
  tests:
    uses: ./.github/workflows/tests.yml

  deploy:
    needs: tests
    # Раннер стоит прямо на VPS в Амстердаме — сборка и старт идут на
    # месте, без SSH-прыжка через домашнюю машину. Метка vps-amsterdam
    # (не просто self-hosted) — чтобы не задело домашний раннер, если он
    # ещё зарегистрирован.
    runs-on: [self-hosted, vps-amsterdam]

    steps:
      - name: Sync code from GitHub
        run: |
          cd /opt/sites/vitazgio.ru
          git fetch origin
          git reset --hard origin/main

      # Кэш чистим ДО сборки, не только после: если прошлая сборка
      # оборвалась (диск кончился, демон перезапустили), запись о слое в
      # BuildKit остаётся, а файла на диске уже нет — сборка падает на
      # первом же шаге (WORKDIR) с "failed to stat parent". Прошлый
      # порядок (только после успешной сборки) не лечил себя: при падении
      # до prune скрипт выходил раньше него.
      - name: Clean up Docker cache
        run: |
          docker builder prune -af
          docker image prune -f

      - name: Build and deploy
        run: |
          cd /opt/sites/vitazgio.ru
          docker compose up -d --build web
          # Проверяем по тому же адресу, по которому реально ходит nginx
          # (npm) на этой VPS — 172.17.0.1, не 127.0.0.1 (см. CLAUDE.md,
          # раздел про топологию прокси). У приложения нет network_mode:
          # host-соседа на loopback, только на docker0-шлюзе.
          ok=
          for i in $(seq 1 20); do
            if curl -fsS --max-time 2 http://172.17.0.1:5000/ >/dev/null; then
              ok=1
              break
            fi
            sleep 1
          done
          if [ "$ok" != 1 ]; then
            docker compose ps
            docker logs --tail=200 vitazgio-site || true
            exit 1
          fi
          docker builder prune -f
          docker image prune -f
