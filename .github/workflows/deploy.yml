name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Sync code from GitHub
        run: |
          cd /opt/sites/vitazgio.ru
          git fetch origin
          git reset --hard origin/main

      - name: Rebuild and restart Docker
        run: |
          cd /opt/sites/vitazgio.ru
          docker compose up -d --build

      - name: Clean up Docker cache
        run: |
          docker builder prune -f
          docker image prune -f
